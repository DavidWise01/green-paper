<!DOCTYPE html>
<html lang="en">
<!-- HEAD IS IDENTICAL TO index.html - DO NOT EDIT -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Your Site Name</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0f;
            color: #e5e5e5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #1f1f29;
        }

        nav a {
            color: #a5b4fc;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #c7d2fe;
            text-decoration: underline;
        }

        main {
            max-width: 720px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
        }

        p {
            color: #b4b4c0;
            margin-bottom: 1.25rem;
            font-size: 1.1rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            main {
                margin: 2.5rem auto;
            }
        }
    </style>
</head>
<!-- EDIT BODY ONLY -->
<body>
    <header>
        <nav>
            <a href="index.html">← Back to Home</a>
        </nav>
    </header>

    <main>
        <h1>About</h1>
        <p>This is where your story goes. Replace this with your bio, project details, or anything you want.</p>
        <p>Keep the head section identical on every page - only the body changes.</p>
    </main>
</body>
</html>
