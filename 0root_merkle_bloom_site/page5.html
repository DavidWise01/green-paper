<h1>4. PNG as Root</h1>
<p>Instead of a database, the PNG carries its own root.</p>
<p>We append 'NEST' + 128 bytes after IEND. PNG viewers ignore it. Our reader finds it.</p>
<code>file.png + NEST + ((((((((1))))))))</code>
