<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cluster Sisters Bomb Field</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow:hidden;background:#030509;color:#cbd5e1;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;height:100%}
  canvas{display:block;position:fixed;inset:0;z-index:0}
  .vignette{pointer-events:none;position:fixed;inset:0;z-index:1;background:radial-gradient(1200px 800px at 50% 20%,rgba(0,0,0,0)0%,rgba(0,0,0,0.2)60%,rgba(0,0,0,0.65)100%), linear-gradient(to bottom,rgba(3,5,9,0) 0%,rgba(3,5,9,0.5) 80%,rgba(3,5,9,0.85)100%)}
  .scan{pointer-events:none;position:fixed;inset:0;z-index:2;opacity:.06;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.8) 0px,rgba(255,255,255,.8)1px,transparent 2px,transparent 4px);mix-blend-mode:overlay}
  .ui{position:absolute;top:16px;left:16px;z-index:10;background:rgba(7,11,18,.72);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(148,163,184,.14);border-radius:18px;padding:16px 18px;min-width:300px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03)}
  .ui h1{margin:0 0 12px;font-size:11px;letter-spacing:.18em;color:#7dd3fc;font-weight:700;text-transform:uppercase}
  .subtitle{font-size:11px;color:#64748b;margin:-6px 0 12px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid rgba(148,163,184,.07)}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
  .name{font-size:12px;color:#e2e8f0;font-weight:650;letter-spacing:.01em;line-height:1}
  .vec{font-size:10px;color:#7a8aa1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:2px}
  .stats{display:flex;gap:16px;font-size:11px;color:#94a3b8;margin:4px 0 12px;flex-wrap:wrap}
  .stats div{display:flex;align-items:baseline;gap:6px;padding:4px 8px;background:rgba(0,0,0,.25);border:1px solid rgba(148,163,184,.08);border-radius:8px}
  .stats b{color:#e6f0ff;font-weight:700;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:8px;align-items:center}
  button{appearance:none;border:1px solid rgba(125,211,252,.25);background:linear-gradient(180deg,rgba(12,20,32,.9),rgba(8,14,22,.9));color:#d7f0ff;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:.2s;box-shadow:0 4px 16px rgba(0,170,255,.12), inset 0 1px 0 rgba(255,255,255,.04)}
  button:hover{border-color:rgba(125,211,252,.5);transform:translateY(-1px);box-shadow:0 6px 22px rgba(0,170,255,.22)}
  button:active{transform:translateY(0)}
  .foot{margin-top:10px;font-size:10px;color:#5b6b82;line-height:1.4}
  .key{color:#a5b4c6}
  @media (max-width:640px){.ui{left:10px;right:10px;min-width:auto}.legend{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="scan"></div>

<div class="ui">
  <h1>Cluster Sisters Bomb Field</h1>
  <div class="subtitle">3×3×3 lattice · additive wave interference</div>
  <div id="legend" class="legend"></div>
  <div class="stats">
    <div>AGENTS <b id="count">0</b></div>
    <div>WAVES <b id="waves">0</b></div>
    <div>GEN <b id="gen">0</b></div>
  </div>
  <div class="controls">
    <button id="restart">Restart Field</button>
  </div>
  <div class="foot"><span class="key">EVE [0,0,-8,0,0]</span> burrows deepest. Sisters operate at ±1 perturbations around zero vector. Drift per generation: +2x, -1z.</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: true });

  const TYPES = {
    EVE: {key:'EVE', name:'EVE', color:'#ff3b30', rgb:[255,59,48], vector:[0,0,-8,0,0], mag:8},
    A: {key:'A', name:'SISTER_A', color:'#00aaff', rgb:[0,170,255], vector:[1,0,0,0,0], mag:1},
    B: {key:'B', name:'SISTER_B', color:'#aa00ff', rgb:[170,0,255], vector:[-1,0,0], mag:1},
    C: {key:'C', name:'SISTER_C', color:'#00ff88', rgb:[0,255,136], vector:[0,1,0,0,0], mag:1},
    D: {key:'D', name:'SISTER_D', color:'#ffcc00', rgb:[255,204,0], vector:[0,-1,0,0,0], mag:1},
  };

  const legendEl = document.getElementById('legend');
  Object.values(TYPES).forEach(t=>{
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span class="dot" style="background:${t.color};box-shadow:0 0 14px ${t.color}, 0 0 28px ${t.color}66"></span><div><div class="name">${t.name}</div><div class="vec">[${t.vector.join(',')}]</div></div>`;
    legendEl.appendChild(div);
  });

  const countEl = document.getElementById('count');
  const wavesEl = document.getElementById('waves');
  const genEl = document.getElementById('gen');

  let agents = [];
  let waves = [];

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr, dpr);
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  function createAgent(type, x, y, z, gen){
    return {
      type, x, y, z,
      vx:0, vy:0, vz:0,
      age:0,
      gen: gen||0,
      state:'falling',
      targetDepth: 140 + type.mag * 38 + Math.random()*28,
      trail:[],
      impactTime:0,
      birth:18
    };
  }

  function createWave(a, extra=0){
    return {
      x:a.x, y:a.y, z:a.z,
      r: 5 + extra*0.25,
      maxR: 90 + a.type.mag * 17,
      alpha: 0.92,
      type: a.type,
      rgb: a.type.rgb,
      color: a.type.color
    };
  }

  function spawnChildren(a){
    if(a.gen >= 4) return;
    if(agents.length > 1760) return;
    const base = a.gen + 1;
    let spawned = 0;
    for(let dz=-1; dz<=1; dz++){
      for(let dy=-1; dy<=1; dy++){
        for(let dx=-1; dx<=1; dx++){
          if(dx===0 && dy===0 && dz===0) continue;
          if(spawned >= 26) break;
          if(agents.length >= 1950) return;
          const child = createAgent(
            a.type,
            a.x + dx*17 + base*2,
            a.y + dy*10,
            a.z + dz*17 - base*1,
            base
          );
          child.targetDepth = a.targetDepth + 22 + a.type.mag*7 + dy*9;
          child.vx = dx*0.11 + (Math.random()-0.5)*0.06;
          child.vz = dz*0.07;
          child.birth = 20;
          agents.push(child);
          spawned++;
        }
      }
    }
  }

  function init(){
    agents = [];
    waves = [];
    const W = innerWidth;
    agents.push(createAgent(TYPES.EVE, W*0.5, -50, 0, 0));
    agents.push(createAgent(TYPES.A, W*0.18, -70, -28, 0));
    agents.push(createAgent(TYPES.B, W*0.82, -88, 32, 0));
    agents.push(createAgent(TYPES.C, W*0.26, -106, -18, 0));
    agents.push(createAgent(TYPES.D, W*0.74, -124, 22, 0));
    agents.forEach(a=>{ a.vx = (Math.random()-0.5)*0.3; a.birth = 26; });
  }

  function drawGrid(){
    const W = innerWidth, H = innerHeight;
    ctx.save();
    ctx.strokeStyle = 'rgba(110,140,190,0.06)';
    ctx.lineWidth = 1;
    for(let y=120; y<H; y+=72){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    for(let x=0; x<W; x+=92){
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    // horizon plane
    ctx.strokeStyle = 'rgba(125,211,252,0.09)';
    ctx.beginPath(); ctx.moveTo(0,110); ctx.lineTo(W,110); ctx.stroke();
    ctx.restore();
  }

  function drawStrata(){
    const W = innerWidth;
    const strata = [
      {y:175, h:52, c:'rgba(20,40,70,0.08)'},
      {y:265, h:58, c:'rgba(30,50,85,0.09)'},
      {y:360, h:64, c:'rgba(40,60,100,0.07)'},
      {y:470, h:80, c:'rgba(15,30,55,0.1)'},
    ];
    ctx.save();
    strata.forEach(s=>{
      ctx.fillStyle = s.c;
      ctx.fillRect(0, s.y, W, s.h);
      ctx.fillStyle = 'rgba(120,180,255,0.035)';
      ctx.fillRect(0, s.y-1, W, 2);
    });
    ctx.restore();
  }

  function updateAgent(a){
    a.age++;
    if(a.birth>0) a.birth--;

    if(a.state === 'falling'){
      a.vy = 2.1 + a.type.mag * 0.33;
      a.y += a.vy;
      a.x += a.vx + Math.sin((a.age + a.gen*13)*0.041)*0.26;
      a.z += a.vz * 0.55;
      a.trail.push({x:a.x,y:a.y,z:a.z});
      if(a.trail.length>10) a.trail.shift();
      if(a.y >= a.targetDepth){
        a.state = 'impact';
        a.impactTime = 0;
        waves.push(createWave(a));
        spawnChildren(a);
      }
    } else if(a.state === 'impact'){
      a.impactTime++;
      if(a.impactTime === 3) waves.push(createWave(a, 8));
      if(a.impactTime > 7){
        a.state = 'ascending';
        a.vy = -1.05 - a.type.mag * 0.075;
      }
    } else if(a.state === 'ascending'){
      a.y += a.vy;
      a.x += a.vx*0.38 + Math.cos(a.age*0.031)*0.14;
      a.z += 0.085;
      a.trail.push({x:a.x,y:a.y,z:a.z});
      if(a.trail.length>8) a.trail.shift();
      if(a.age % 13 === 0) waves.push(createWave(a, 4));
    }
  }

  function drawAgent(a){
    const sx = a.x + a.z*0.35;
    const sy = a.y + a.z*0.12;

    // streak
    if(a.trail.length > 2){
      ctx.beginPath();
      for(let i=0;i<a.trail.length;i++){
        const p = a.trail[i];
        const tx = p.x + p.z*0.35;
        const ty = p.y + p.z*0.12;
        if(i===0) ctx.moveTo(tx,ty); else ctx.lineTo(tx,ty);
      }
      ctx.strokeStyle = `rgba(${a.type.rgb[0]},${a.type.rgb[1]},${a.type.rgb[2]},0.32)`;
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    const glow = a.birth>0 || a.type.key==='EVE' || a.state==='impact';
    const shellR = 7 + a.type.mag*0.62 + (a.birth>0 ? a.birth*0.45 : 0);

    // outer shell
    ctx.beginPath();
    ctx.arc(sx, sy, shellR, 0, Math.PI*2);
    if(glow){ ctx.shadowBlur = 18; ctx.shadowColor = a.type.color; }
    ctx.strokeStyle = `rgba(${a.type.rgb[0]},${a.type.rgb[1]},${a.type.rgb[2]},${0.78 + (a.birth>0?0.18:0)})`;
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // core pod
    ctx.beginPath();
    ctx.arc(sx, sy, 3.3, 0, Math.PI*2);
    ctx.fillStyle = a.type.color;
    if(glow){ ctx.shadowBlur = 12; ctx.shadowColor = a.type.color; }
    ctx.fill();
    ctx.shadowBlur = 0;

    if(a.type.key === 'EVE'){
      ctx.font = '700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgba(255,210,200,0.95)';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff3b30';
      ctx.fillText('EVE', sx, sy - 15);
      ctx.shadowBlur = 0;
    }
  }

  function drawWave(w){
    const sx = w.x + w.z*0.35;
    const sy = w.y + w.z*0.12;
    ctx.beginPath();
    ctx.arc(sx, sy, w.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${w.rgb[0]},${w.rgb[1]},${w.rgb[2]},${w.alpha})`;
    ctx.lineWidth = 1.3 + w.type.mag*0.13;
    if(w.r < w.maxR * 0.55){
      ctx.shadowBlur = 22;
      ctx.shadowColor = w.color;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // inner interference ring
    if(w.r > 18){
      ctx.beginPath();
      ctx.arc(sx, sy, w.r*0.6, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${w.rgb[0]},${w.rgb[1]},${w.rgb[2]},${w.alpha*0.25})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  function tick(){
    requestAnimationFrame(tick);
    const W = innerWidth, H = innerHeight;

    // fade trails
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(3,5,9,0.24)';
    ctx.fillRect(0,0,W,H);

    drawGrid();
    drawStrata();

    // waves additive
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(let i=waves.length-1;i>=0;i--){
      const w = waves[i];
      w.r += 2.35 + w.type.mag*0.17;
      w.alpha *= 0.9825;
      if(w.alpha < 0.018 || w.r > w.maxR){
        waves.splice(i,1); continue;
      }
      drawWave(w);
    }
    ctx.restore();

    // agents additive
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(let i=agents.length-1;i>=0;i--){
      const a = agents[i];
      updateAgent(a);
      drawAgent(a);
      if(a.state==='ascending' && a.y < -70){
        agents.splice(i,1);
      }
    }
    ctx.restore();

    if(agents.length > 2000){
      agents.splice(0, agents.length - 2000);
    }

    // UI
    countEl.textContent = agents.length.toLocaleString();
    wavesEl.textContent = waves.length.toString();
    let maxGen = 0;
    for(let i=0;i<agents.length;i++) if(agents[i].gen > maxGen) maxGen = agents[i].gen;
    genEl.textContent = maxGen.toString();
  }

  document.getElementById('restart').addEventListener('click', init);

  init();
  tick();
})();
</script>
</body>
</html>
