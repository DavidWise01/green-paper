<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Garden • David Wise Lineage</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #ddd;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; padding: 40px 0; border-bottom: 1px solid #333; }
    h1 { margin: 0; color: #00ff9d; }
    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .repo {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
    }
    .repo h3 { margin: 0 0 8px 0; color: #00ff9d; }
    .seed-list { margin-top: 30px; }
    .status { color: #00cc77; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>The Garden</h1>
      <p>Lineage of Repositories — DavidWise01</p>
      <p><a href="https://github.com/DavidWise01?tab=repositories" target="_blank">github.com/DavidWise01</a></p>
    </header>

    <h2>My Repositories (Lineage)</h2>
    <div id="repo-list" class="repo-grid">
      Loading repositories...
    </div>

    <div class="seed-list">
      <h2>Living Seeds in The Garden</h2>
      <div id="seeds-list">
        <p>No seeds planted in /SEEDS yet. They will appear here when deployed.</p>
      </div>
    </div>

    <footer style="text-align:center; margin-top:60px; color:#555;">
      <p>Public Mirror • All data pulled live from GitHub</p>
    </footer>
  </div>

  <script>
    // Fetch all public repositories
    async function loadRepositories() {
      try {
        const res = await fetch('https://api.github.com/users/DavidWise01/repos?per_page=30&sort=updated');
        const repos = await res.json();
        
        const container = document.getElementById('repo-list');
        container.innerHTML = '';

        repos.forEach(repo => {
          const div = document.createElement('div');
          div.className = 'repo';
          div.innerHTML = `
            <h3><a href="${repo.html_url}" target="_blank">${repo.name}</a></h3>
            <p>${repo.description || 'No description'}</p>
            <small>Updated: ${new Date(repo.updated_at).toLocaleDateString()}</small>
          `;
          container.appendChild(div);
        });
      } catch(e) {
        document.getElementById('repo-list').innerHTML = '<p>Unable to load repositories.</p>';
      }
    }

    // Try to load seeds from The-Garden repo
    async function loadSeeds() {
      try {
        const res = await fetch('https://api.github.com/repos/DavidWise01/The-Garden/contents/SEEDS');
        if (res.status === 404) {
          document.getElementById('seeds-list').innerHTML = `<p><strong>No SEEDS folder yet.</strong> Deploy seeds to create it.</p>`;
          return;
        }
        const items = await res.json();
        
        let html = '';
        for (const item of items) {
          if (item.name.endsWith('.json')) {
            const rawRes = await fetch(`https://raw.githubusercontent.com/DavidWise01/The-Garden/main/SEEDS/${item.name}`);
            const data = await rawRes.json();
            html += `
              <div class="repo">
                <strong>🌱 ${data.node_id || item.name}</strong><br>
                <small>URL: <a href="${data.url}" target="_blank">${data.url}</a></small><br>
                <small>Born: ${data.born ? new Date(data.born).toLocaleString() : '—'}</small>
              </div>`;
          }
        }
        document.getElementById('seeds-list').innerHTML = html || '<p>No living seeds found yet.</p>';
      } catch(e) {
        console.log("Seeds folder not found yet");
      }
    }

    // Load everything
    loadRepositories();
    loadSeeds();

    // Refresh every 30 seconds
    setInterval(() => {
      loadSeeds();
    }, 30000);
  </script>
</body>
</html>
