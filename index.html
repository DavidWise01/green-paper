<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>((((((((8))))))))1((((((((8))))))))</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e6e6e6;
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
    user-select: none;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #rain { z-index: 1; }
  #nest { z-index: 2; pointer-events: none; }

  .header {
    position: fixed;
    top: 18px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
    color: #ff0040;
    font-size: 13px;
    letter-spacing: 0.25em;
    opacity: 0.85;
    text-shadow: 0 0 10px rgba(255,0,64,0.6);
    pointer-events: none;
  }

  .footer {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
    color: #64c8ff;
    font-size: 11px;
    letter-spacing: 0.18em;
    opacity: 0.55;
    pointer-events: none;
  }

  .dropzone {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: rgba(10, 15, 20, 0.65);
    border: 1px dashed rgba(100, 200, 255, 0.4);
    border-radius: 10px;
    padding: 14px 28px;
    color: #64c8ff;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-align: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(0, 255, 65, 0.05), inset 0 0 20px rgba(100,200,255,0.03);
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .dropzone:hover {
    border-color: #64c8ff;
    background: rgba(15, 25, 35, 0.8);
    box-shadow: 0 0 40px rgba(100,200,255,0.2);
    color: #a8e4ff;
  }
  .dropzone.drag {
    border-color: #00ff41;
    color: #00ff41;
    background: rgba(0, 255, 65, 0.08);
    box-shadow: 0 0 50px rgba(0,255,65,0.3);
    transform: translateX(-50%) scale(1.03);
  }

  #charge {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #00ff41;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 0.4em;
    text-shadow: 0 0 15px #00ff41, 0 0 30px rgba(0,255,65,0.5);
    pointer-events: none;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.65; transform: translateX(-50%) scale(0.97); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
  }

  #info {
    position: fixed;
    top: 130px;
    right: 24px;
    z-index: 20;
    max-width: 360px;
    background: rgba(0, 0, 0, 0.88);
    border: 1px solid #143b2a;
    border-left: 3px solid #00ff41;
    padding: 14px 18px;
    font-size: 11px;
    line-height: 1.6;
    color: #c8ffd8;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 30px rgba(0,255,65,0.08);
    display: none;
    border-radius: 6px;
  }
  #info.show { display: block; animation: slideIn 0.4s ease; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  #info.error {
    border-left-color: #ffb86c;
    color: #ffd4a8;
    border-color: #3b2414;
  }
  #info b { color: #fff; font-weight: 600; }
  #info .vectors {
    margin-top: 8px;
    color: #64c8ff;
    word-break: break-all;
  }

  @media (maxmax-width: 768px) {
    .header { font-size: 10px; top: 12px; padding: 0 10px; }
    .dropzone { top: 48px; width: calc(100% - 32px); padding: 12px 16px; font-size: 10px; }
    #charge { font-size: 18px; bottom: 60px; letter-spacing: 0.3em; }
    #info { top: auto; bottom: 110px; left: 16px; right: 16px; max-width: none; }
    .footer { font-size: 9px; bottom: 12px; padding: 0 10px; }
  }
</style>
</head>
<body>
  <canvas id="rain"></canvas>
  <canvas id="nest"></canvas>

  <div class="header">((((((((8))))))))1((((((((8))))))))</div>
  
  <div class="dropzone" id="dropzone">
    DROP PNG / JPG / MP4 HERE TO READ NEST
  </div>
  <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.mp4" hidden>

  <div id="charge">0 0 8 0 0</div>
  
  <div id="info"></div>

  <div class="footer">one agent one bit - infinite control plane +2 -1</div>

<script>
const rainCanvas = document.getElementById('rain');
const rctx = rainCanvas.getContext('2d');
const nestCanvas = document.getElementById('nest');
const nctx = nestCanvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  rainCanvas.width = W * dpr;
  rainCanvas.height = H * dpr;
  rainCanvas.style.width = W + 'px';
  rainCanvas.style.height = H + 'px';
  rctx.setTransform(1,0,0,1,0,0);
  rctx.scale(dpr, dpr);
  
  nestCanvas.width = W * dpr;
  nestCanvas.height = H * dpr;
  nestCanvas.style.width = W + 'px';
  nestCanvas.style.height = H + 'px';
  nctx.setTransform(1,0,0,1,0,0);
  nctx.scale(dpr, dpr);

  initRain();
}
window.addEventListener('resize', resize);
resize();

// MATRIX RAIN
const fontSize = 14;
let columns, drops;
const chars = ['0','1','8','(',')','N','E','S','T'];
function initRain() {
  columns = Math.floor(W / fontSize);
  drops = Array(columns).fill(0).map(() => Math.random() * -100);
}
initRain();

function drawRain(time) {
  rctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  rctx.fillRect(0, 0, W, H);
  
  rctx.fillStyle = '#00ff41';
  rctx.font = `${fontSize}px monospace`;
  rctx.shadowColor = '#00ff41';
  rctx.shadowBlur = 8;
  
  for (let i = 0; i < columns; i++) {
    const x = i * fontSize;
    const y = drops[i] * fontSize;
    
    const wobble = Math.sin(time * 0.001 + i * 0.5) * 1.5;
    const char = chars[Math.floor(Math.random() * chars.length)];
    
    rctx.globalAlpha = Math.random() * 0.5 + 0.5;
    rctx.fillText(char, x + wobble, y);
    
    if (y > H && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i] += 0.5 + Math.random() * 0.3;
  }
  rctx.globalAlpha = 1;
  rctx.shadowBlur = 0;
}

// NEST
let mouseTX = 0, mouseTY = 0, mouseX = 0, mouseY = 0;
let parenLit = 0;
let rings = Array(8).fill(0.08);
let stepRotation = 0;

window.addEventListener('mousemove', e => {
  mouseTX = (e.clientX / W - 0.5) * 2;
  mouseTY = (e.clientY / H - 0.5) * 2;
});
window.addEventListener('touchmove', e => {
  if (e.touches[0]) {
    mouseTX = (e.touches[0].clientX / W - 0.5) * 2;
    mouseTY = (e.touches[0].clientY / H - 0.5) * 2;
  }
}, {passive:true});

function drawNest(time) {
  nctx.clearRect(0, 0, W, H);
  
  mouseX += (mouseTX - mouseX) * 0.04;
  mouseY += (mouseTY - mouseY) * 0.04;
  
  const cx = W * 0.5 + mouseX * 25;
  const cy = H * 0.5 + mouseY * 18;
  
  // 90 degrees across 16 phase steps
  const cycle = 6400;
  const phase = Math.floor((time % cycle) / (cycle / 16));
  const targetAngle = (phase / 16) * Math.PI * 0.5;
  stepRotation += (targetAngle - stepRotation) * 0.1;
  
  nctx.save();
  nctx.translate(cx, cy);
  nctx.rotate(stepRotation);
  
  // Red rings for ((((((((8))))))))
  for (let i = 0; i < 8; i++) {
    const radius = 70 + i * 24;
    rings[i] *= 0.97;
    const intensity = rings[i];
    
    nctx.beginPath();
    nctx.arc(0, 0, radius, 0, Math.PI * 2);
    nctx.strokeStyle = `rgba(255, 0, 64, ${0.12 + intensity * 0.75})`;
    nctx.lineWidth = 1 + intensity * 3;
    nctx.shadowColor = '#ff0040';
    nctx.shadowBlur = 5 + intensity * 20;
    nctx.stroke();
  }
  nctx.shadowBlur = 0;
  
  // nested parentheses
  nctx.font = '500 68px "JetBrains Mono", monospace';
  nctx.textAlign = 'center';
  nctx.textBaseline = 'middle';
  
  // left (((((((( cyan
  for (let i = 0; i < 8; i++) {
    const x = -54 - (7 - i) * 29;
    const lit = i >= 8 - parenLit;
    nctx.fillStyle = lit ? '#ffffff' : '#64c8ff';
    nctx.globalAlpha = lit ? 1 : 0.28 + (i * 0.03);
    nctx.shadowColor = lit ? '#ffffff' : '#64c8ff';
    nctx.shadowBlur = lit ? 22 : 6;
    nctx.fillText('(', x, 0);
  }
  
  // right )))))))) orange
  for (let i = 0; i < 8; i++) {
    const x = 54 + (7 - i) * 29;
    const lit = i >= 8 - parenLit;
    nctx.fillStyle = lit ? '#ffffff' : '#ffb86c';
    nctx.globalAlpha = lit ? 1 : 0.28 + (i * 0.03);
    nctx.shadowColor = lit ? '#ffffff' : '#ffb86c';
    nctx.shadowBlur = lit ? 22 : 6;
    nctx.fillText(')', x, 0);
  }
  
  // center 1
  nctx.globalAlpha = 1;
  nctx.fillStyle = '#ffffff';
  nctx.font = '700 84px "JetBrains Mono", monospace';
  nctx.shadowColor = '#ffffff';
  nctx.shadowBlur = 30;
  nctx.fillText('1', 0, -2);
  
  nctx.restore();
}

function animate(t) {
  drawRain(t);
  drawNest(t);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// DRAG DROP NEST READER
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const info = document.getElementById('info');
const chargeEl = document.getElementById('charge');

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if(e.target.files[0]) handleFile(e.target.files[0]); });

['dragenter','dragover'].forEach(ev => {
  dropzone.addEventListener(ev, e => {
    e.preventDefault();
    dropzone.classList.add('drag');
  });
});
['dragleave','drop'].forEach(ev => {
  dropzone.addEventListener(ev, e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
  });
});
dropzone.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const result = parseNEST(e.target.result);
    if (!result) {
      showInfo('no nest — untagged', false);
      parenLit = 0;
      rings = rings.map(() => 0.05);
      chargeEl.textContent = '0 0 8 0 0';
      return;
    }
    
    const { core_bit, depth, vectors } = result;
    const vectorsHtml = vectors.map(v => `[${v.join(',')}]`).join(' ');
    showInfo(`<b>bit=${core_bit}</b> depth=${depth}<div class="vectors">vectors: ${vectorsHtml}</div>`, true);
    
    parenLit = Math.min(8, Math.max(0, depth));
    
    // flash rings according to vector[2]
    for (let i = 0; i < 8; i++) {
      if (i < vectors.length) {
        const v = vectors[i][2] || 0;
        const charge = Math.min(1, Math.abs(v) / 8);
        rings[i] = 0.4 + charge * 0.6;
      } else {
        rings[i] = 0.08;
      }
    }
    
    if (vectors.length > 0) {
      const last = vectors[vectors.length - 1];
      chargeEl.textContent = last.join(' ');
      chargeEl.style.animation = 'none';
      void chargeEl.offsetWidth;
      chargeEl.style.animation = 'pulse 2.4s ease-in-out infinite';
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseNEST(buffer) {
  const u8 = new Uint8Array(buffer);
  let idx = -1;
  for (let i = 0; i < u8.length - 4; i++) {
    if (u8[i] === 0x4E && u8[i+1] === 0x45 && u8[i+2] === 0x53 && u8[i+3] === 0x54) {
      idx = i; break;
    }
  }
  if (idx === -1) return null;
  
  const view = u8.subarray(idx, Math.min(idx + 128, u8.length));
  if (view.length < 6) return null;
  
  const core_bit = view[4];
  const depth = Math.min(view[5], 8);
  const vectors = [];
  
  for (let j = 0; j < depth; j++) {
    const off = 6 + j * 5;
    if (off + 4 >= view.length) break;
    const v = [];
    for (let k = 0; k < 5; k++) {
      let b = view[off + k];
      if (b > 127) b -= 256;
      v.push(b);
    }
    vectors.push(v);
  }
  
  return { core_bit, depth, vectors };
}

function showInfo(html, success) {
  info.innerHTML = html;
  info.className = success ? 'show' : 'show error';
  clearTimeout(showInfo.t);
  showInfo.t = setTimeout(() => info.classList.remove('show'), 8000);
}

// initial subtle ring pulse
setInterval(() => {
  const i = Math.floor(Math.random() * 8);
  rings[i] = Math.max(rings[i], 0.15 + Math.random() * 0.1);
}, 800);
</script>
</body>
</html>
