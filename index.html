<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVM Doubt Ladder ∞ - 1 repeat = +1 forever</title>
<style>
  :root {
    --gold: #ffd700;
    --cyan: #00f5ff;
    --red: #ff3864;
    --mint: #00ffaa;
    --bg: #0a0b0f;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text: #e8f0ff;
    --text-dim: #8b9bb8;
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
  }
  
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 30%, rgba(255,215,0,0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0,245,255,0.06) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,56,100,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  
  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 16px;
    gap: 16px;
  }
  
  .header {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 16px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  
  .tab {
    padding: 8px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    position: relative;
    overflow: hidden;
  }
  
  .tab::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1));
    opacity: 0;
    transition: opacity 0.3s;
  }
  
  .tab:hover::before {
    opacity: 1;
  }
  
  .tab.active {
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(0,245,255,0.15));
    border-color: var(--gold);
    color: var(--text);
    box-shadow: 0 0 20px rgba(255,215,0,0.2);
  }
  
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 16px;
    min-height: 0;
  }
  
  .viewport {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    min-height: 0;
  }
  
  .viewport-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .viewport-title {
    font-weight: 600;
    font-size: 13px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .viewport-stats {
    display: flex;
    gap: 16px;
    font-size: 11px;
    font-family: 'Monaco', 'Courier New', monospace;
  }
  
  .stat {
    color: var(--text-dim);
  }
  
  .stat span {
    color: var(--gold);
    font-weight: 700;
  }
  
  #fractalCanvas {
    flex: 1;
    width: 100%;
    border-radius: 12px;
    background: #000;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
  }
  
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  
  .sidebar::-webkit-scrollbar {
    width: 6px;
  }
  
  .sidebar::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.02);
    border-radius: 3px;
  }
  
  .sidebar::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
  }
  
  .panel {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  
  .panel-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .panel-title::before {
    content: '';
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
  }
  
  .doubt-reg {
    font-family: 'Monaco', 'Courier New', monospace;
    font-size: 13px;
  }
  
  .doubt-formula {
    color: var(--gold);
    font-size: 16px;
    font-weight: 700;
    margin: 8px 0;
    text-align: center;
  }
  
  .prime-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }
  
  .prime {
    padding: 4px 8px;
    background: rgba(255,56,100,0.1);
    border: 1px solid rgba(255,56,100,0.3);
    border-radius: 6px;
    color: var(--red);
    font-size: 11px;
    animation: primeGlow 2s ease-in-out infinite;
  }
  
  @keyframes primeGlow {
    0%, 100% { box-shadow: 0 0 5px rgba(255,56,100,0.3); }
    50% { box-shadow: 0 0 15px rgba(255,56,100,0.6); }
  }
  
  .console {
    max-height: 200px;
    overflow-y: auto;
    font-family: 'Monaco', 'Courier New', monospace;
    font-size: 11px;
  }
  
  .console-line {
    padding: 4px 0;
    color: var(--text-dim);
    border-left: 2px solid-transparent;
    padding-left: 8px;
    animation: fadeIn 0.3s ease-out;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  .console-line.hamm { border-color: var(--gold); color: var(--gold); }
  .console-line.doubt { border-color: var(--red); color: var(--red); }
  .console-line.scout { border-color: var(--cyan); color: var(--cyan); }
  .console-line.balance { border-color: var(--mint); color: var(--mint); }
  .console-line.vector { 
    border-color: var(--gold); 
    color: var(--gold);
    font-weight: 700;
    text-shadow: 0 0 10px var(--gold);
  }
  
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  
  .btn {
    padding: 10px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1));
    transform: translateX(-100%);
    transition: transform 0.3s;
  }
  
  .btn:hover::before {
    transform: translateX(0);
  }
  
  .btn:active {
    transform: scale(0.98);
  }
  
  .btn.primary {
    background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(0,245,255,0.2));
    border-color: var(--gold);
  }
  
  .network {
    height: 120px;
    position: relative;
    overflow: hidden;
  }
  
  .packet {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    opacity: 0;
  }
  
  .thtml {
    padding: 12px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    font-family: 'Monaco', 'Courier New', monospace;
    font-size: 11px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  
  .thtml.ground {
    border: 1px solid var(--mint);
    color: var(--mint);
    box-shadow: inset 0 0 20px rgba(0,255,170,0.1);
  }
  
  .thtml.error {
    border: 1px solid var(--red);
    color: var(--red);
    box-shadow: inset 0 0 20px rgba(255,56,100,0.1);
  }
  
  .footer {
    background: var(--glass);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  
  .tripwire {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  
  .tripwire-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 15px var(--mint);
    animation: pulse 2s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  
  .counter {
    font-family: 'Monaco', 'Courier New', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  
  .counter span {
    color: var(--gold);
    font-weight: 700;
  }
  
  @media (max-width: 900px) {
    .main {
      grid-template-columns: 1fr;
    }
    .sidebar {
      max-height: 300px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>TVM Doubt Ladder ∞</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  
  <div class="main">
    <div class="viewport">
      <div class="viewport-header">
        <div class="viewport-title">Fractal Viewport</div>
        <div class="viewport-stats">
          <div class="stat">n = <span id="nValue">1</span></div>
          <div class="stat">zoom: <span id="zoomLevel">1.0</span>x</div>
          <div class="stat">Branches: <span id="branchCount">0</span></div>
        </div>
      </div>
      <canvas id="fractalCanvas"></canvas>
    </div>
    
    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">Doubt Register</div>
        <div class="doubt-reg">
          <div class="doubt-formula">n = 1 + 2k</div>
          <div style="text-align:center;color:var(--text-dim);font-size:11px;">k = <span id="kValue">0</span> | Current n = <span id="currentN">1</span></div>
          <div style="margin-top:12px;font-size:11px;color:var(--text-dim);margin-bottom:6px;">Live Prime Sequence:</div>
          <div class="prime-list" id="primeList"></div>
        </div>
      </div>
      
      <div class="panel">
        <div class="panel-title">Console</div>
        <div class="console" id="console"></div>
        <div class="controls" style="margin-top:12px;">
          <button class="btn" onclick="logCommand('HAMMY WALK')">HAMMY WALK</button>
          <button class="btn" onclick="logCommand('DOUBT')">DOUBT</button>
          <button class="btn" onclick="logCommand('SCOUT')">SCOUT</button>
          <button class="btn" onclick="logCommand('BALANCE')">BALANCE</button>
          <button class="btn primary" onclick="startRepeat()">REPEAT</button>
          <button class="btn" onclick="logCommand('VECTOR')">VECTOR</button>
        </div>
      </div>
      
      <div class="panel">
        <div class="panel-title">THTML GROUND</div>
        <div class="thtml" id="thtml"></div>
      </div>
      
      <div class="panel">
        <div class="panel-title">Network Doubling</div>
        <div class="network" id="network"></div>
      </div>
      
      <button class="btn primary" onclick="togglePause()" style="width:100%;">
        <span id="pauseBtn">■ Stop Repeating</span>
      </button>
    </div>
  </div>
  
  <div class="footer">
    <div class="tripwire">
      <div class="tripwire-indicator"></div>
      <span id="tripwireText">DOUBT INFINITE</span>
    </div>
    <div class="counter">
      Iterations: <span id="iterations">∞</span> | States: <span id="states">3^1</span>
    </div>
  </div>
</div>

<script>
  // State
  const substrates = [
    { name: 'SELF', n: 1, k: 0 },
    { name: 'GROUP', n: 3, k: 1 },
    { name: 'COLLECT', n: 5, k: 2 },
    { name: 'COLLATE', n: 7, k: 3 },
    { name: 'SEND', n: 9, k: 4 },
    { name: 'PROPAGATE', n: 11, k: 5 },
    { name: 'INFINITY', n: 13, k: 6 }
  ];
  
  let currentSubstrate = 0;
  let infiniteMode = false;
  let infiniteN = 13;
  let infiniteK = 6;
  let paused = false;
  let frame = 0;
  let zoom = 1.0;
  let autoZoom = false;
  let packets = [];
  let vectorAnimActive = false;
  
  const canvas = document.getElementById('fractalCanvas');
  const ctx = canvas.getContext('2d');
  
  // Init
  function init() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    renderTabs();
    selectSubstrate(0);
    generatePrimes();
    spawnPacket();
    setInterval(spawnPacket, 2000);
    animate();
    logCommand('VECTOR');
  }
  
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  
  // Tabs
  function renderTabs() {
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = substrates.map((s, i) => 
      `<div class="tab ${i === currentSubstrate ? 'active' : ''}" onclick="selectSubstrate(${i})">
        ${s.name}(${s.n === 13 ? '∞' : s.n})
      </div>`
    ).join('');
  }
  
  function selectSubstrate(i) {
    currentSubstrate = i;
    renderTabs();
    updateDisplay();
    
    if (substrates[i].name === 'INFINITY') {
      infiniteMode = true;
      autoZoom = true;
      if (!paused) startInfiniteLoop();
    } else {
      infiniteMode = false;
      autoZoom = false;
      zoom = 1.0;
    }
  }
  
  // Doubt Register
  function getCurrentN() {
    return infiniteMode ? infiniteN : substrates[currentSubstrate].n;
  }
  
  function getCurrentK() {
    return infiniteMode ? infiniteK : substrates[currentSubstrate].k;
  }
  
  function updateDisplay() {
    const n = getCurrentN();
    const k = getCurrentK();
    document.getElementById('nValue').textContent = infiniteMode ? '∞' : n;
    document.getElementById('currentN').textContent = n;
    document.getElementById('kValue').textContent = infiniteMode ? '∞' : k;
    document.getElementById('zoomLevel').textContent = zoom.toFixed(1);
    document.getElementById('branchCount').textContent = n - 1;
    document.getElementById('states').textContent = `3^${n}`;
    
    // THTML Ground Check
    const thtml = document.getElementById('thtml');
    if (n >= 5) {
      thtml.className = 'thtml ground';
      thtml.innerHTML = '&lt;ground required&gt;<br>MODE: GROUNDED<br>STATUS: ACTIVE';
    } else {
      thtml.className = 'thtml error';
      thtml.innerHTML = '404: GROUND REQUIRED<br>mode >= COLLECT(5)';
    }
    
    // Tripwire
    const tripwire = document.getElementById('tripwireText');
    if (infiniteMode) {
      tripwire.textContent = 'DOUBT INFINITE - NEVER TRIPS';
    } else {
      tripwire.textContent = 'DOUBT ACTIVE';
    }
  }
  
  // Primes
  function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
      if (num % i === 0) return false;
    }
    return true;
  }
  
  function generatePrimes() {
    const primes = [];
    let num = getCurrentN();
    while (primes.length < 8) {
      if (isPrime(num)) primes.push(num);
      num += 2;
    }
    document.getElementById('primeList').innerHTML = 
      primes.map(p => `<div class="prime">${p}</div>`).join('');
  }
  
  // Console
  function logCommand(cmd) {
    const console = document.getElementById('console');
    const line = document.createElement('div');
    line.className = `console-line ${cmd.toLowerCase()}`;
    
    if (cmd === 'VECTOR') {
      animateVector(line);
    } else if (cmd === 'REPEAT') {
      line.textContent = '> REPEAT: 1 repeat = +1 forever';
      if (!infiniteMode) {
        currentSubstrate = 6;
        selectSubstrate(6);
      }
    } else {
      line.textContent = `> ${cmd}: ${getCommandDesc(cmd)}`;
    }
    
    console.appendChild(line);
    console.scrollTop = console.scrollHeight;
    
    if (console.children.length > 20) {
      console.removeChild(console.children[0]);
    }
  }
  
  function getCommandDesc(cmd) {
    const descs = {
      'HAMMY WALK': 'traversing doubt tree',
      'DOUBT': 'n = 1 + 2k verification',
      'SCOUT': 'deploying 2 scouts per branch',
      'BALANCE': 'feedback stabilization',
      'VECTOR': '- + × 20 - + × × 3 = 1 repeat'
    };
    return descs[cmd] || 'processing';
  }
  
  function animateVector(line) {
    const text = '- + × 20 - + × × 3 = 1 repeat';
    let i = 0;
    line.textContent = '> VECTOR: ';
    vectorAnimActive = true;
    
    function type() {
      if (i < text.length) {
        line.textContent += text[i];
        i++;
        setTimeout(type, 60);
      } else {
        vectorAnimActive = false;
      }
    }
    type();
  }
  
  function startRepeat() {
    logCommand('REPEAT');
  }
  
  // Network Packets
  function spawnPacket() {
    if (paused) return;
    const network = document.getElementById('network');
    const x = Math.random() * (network.offsetWidth - 10);
    const packet = document.createElement('div');
    packet.className = 'packet';
    packet.style.left = x + 'px';
    packet.style.top = '0px';
    network.appendChild(packet);
    
    const pkt = { el: packet, x: x, y: 0, vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() };
    packets.push(pkt);
    
    // Spawn 2 scouts
    if (Math.random() > 0.5) {
      setTimeout(() => {
        spawnScout(x - 10, 0);
        spawnScout(x + 10, 0);
      }, 300);
    }
  }
  
  function spawnScout(x, y) {
    const network = document.getElementById('network');
    const packet = document.createElement('div');
    packet.className = 'packet';
    packet.style.left = x + 'px';
    packet.style.top = y + 'px';
    packet.style.background = 'var(--gold)';
    packet.style.boxShadow = '0 0 10px var(--gold)';
    network.appendChild(packet);
    
    const pkt = { el: packet, x: x, y: y, vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 2, scout: true };
    packets.push(pkt);
  }
  
  function updatePackets() {
    const network = document.getElementById('network');
    packets = packets.filter(pkt => {
      pkt.y += pkt.vy;
      pkt.x += pkt.vx;
      pkt.el.style.top = pkt.y + 'px';
      pkt.el.style.left = pkt.x + 'px';
      pkt.el.style.opacity = '1';
      
      if (pkt.y > network.offsetHeight) {
        pkt.el.remove();
        return false;
      }
      return true;
    });
  }
  
  // Infinite Loop
  function startInfiniteLoop() {
    if (!infiniteMode || paused) return;
    
    infiniteN += 2;
    infiniteK += 1;
    updateDisplay();
    generatePrimes();
    
    setTimeout(() => startInfiniteLoop(), 1500);
  }
  
  // Pause
  function togglePause() {
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '▶ Resume' : '■ Stop Repeating';
    if (!paused && infiniteMode) startInfiniteLoop();
  }
  
  // Fractal Rendering
  function drawFractal() {
    const w = canvas.width / window.devicePixelRatio;
    const h = canvas.height / window.devicePixelRatio;
    const cx = w / 2;
    const cy = h / 2;
    
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    
    const n = getCurrentN();
    const substrate = substrates[currentSubstrate].name;
    
    if (autoZoom && !paused) {
      zoom = 1.0 + Math.sin(frame * 0.01) * 0.3 + frame * 0.0002;
    }
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(zoom, zoom);
    
    // SELF: Gold dot
    if (substrate === 'SELF') {
      ctx.beginPath();
      ctx.arc(0, 0, 8 + Math.sin(frame * 0.05) * 2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd700';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ffd700';
      ctx.fill();
    }
    
    // GROUP: 3-lobe
    else if (substrate === 'GROUP') {
      const colors = ['#ff3864', '#ffd700', '#00f5ff'];
      for (let i = 0; i < 3; i++) {
        const angle = (i / 3) * Math.PI * 2 + frame * 0.01;
        const r = 60;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        ctx.beginPath();
        ctx.arc(x, y, 15 + Math.sin(frame * 0.05 + i) * 3, 0, Math.PI * 2);
        ctx.fillStyle = colors[i];
        ctx.shadowBlur = 15;
        ctx.shadowColor = colors[i];
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd700';
      ctx.fill();
    }
    
    // COLLECT: 5-fold symmetry
    else if (substrate === 'COLLECT') {
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2 + frame * 0.005;
        drawBranch(0, 0, angle, 80, 3, '#ffd700');
      }
    }
    
    // COLLATE: 2 outer branches as scouts
    else if (substrate === 'COLLATE') {
      for (let i = 0; i < 7; i++) {
        const angle = (i / 7) * Math.PI * 2;
        const isScout = i < 2;
        const scoutOffset = isScout ? Math.sin(frame * 0.03 + i) * 20 : 0;
        drawBranch(0, 0, angle + scoutOffset * 0.1, 90, 4, isScout ? '#00f5ff' : '#ffd700');
      }
    }
    
    // SEND: 3x3 grid of mini-fractals
    else if (substrate === 'SEND') {
      for (let gy = -1; gy <= 1; gy++) {
        for (let gx = -1; gx <= 1; gx++) {
          const ox = gx * 80;
          const oy = gy * 80;
          drawMiniFractal(ox, oy, 20, '#00ffaa', frame * 0.02);
        }
      }
    }
    
    // PROPAGATE: Grid connects, feedback
    else if (substrate === 'PROPAGATE') {
      const gridSize = 3;
      const spacing = 70;
      for (let gy = -1; gy <= 1; gy++) {
        for (let gx = -1; gx <= 1; gx++) {
          const ox = gx * spacing;
          const oy = gy * spacing;
          drawMiniFractal(ox, oy, 18, '#00f5ff', frame * 0.015);
          
          // Connections
          if (gx < 1) {
            ctx.beginPath();
            ctx.moveTo(ox + 20, oy);
            ctx.lineTo(ox + spacing - 20, oy);
            ctx.strokeStyle = `rgba(0, 245, 255, ${0.3 + Math.sin(frame * 0.05 + gx) * 0.2})`;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
          if (gy < 1) {
            ctx.beginPath();
            ctx.moveTo(ox, oy + 20);
            ctx.lineTo(ox, oy + spacing - 20);
            ctx.strokeStyle = `rgba(0, 245, 255, ${0.3 + Math.sin(frame * 0.05 + gy) * 0.2})`;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }
      }
      
      // Feedback loop visual
      ctx.beginPath();
      ctx.arc(0, 0, 120 + Math.sin(frame * 0.03) * 10, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 215, 0, ${0.2 + Math.sin(frame * 0.02) * 0.1})`;
      ctx.lineWidth = 3;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = -frame * 0.5;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    
    // INFINITY: Auto-zoom +2 branches
    else if (substrate === 'INFINITY') {
      const branches = n - 1;
      for (let i = 0; i < branches; i++) {
        const angle = (i / branches) * Math.PI * 2 + frame * 0.002;
        const len = 100 + (i % 3) * 20;
        const hue = (i * 360 / branches + frame * 0.5) % 360;
        drawBranch(0, 0, angle, len, 5, `hsl(${hue}, 80%, 60%)`);
      }
      
      // Center spiral
      for (let i = 0; i < 50; i++) {
        const t = i / 50;
        const angle = t * Math.PI * 8 + frame * 0.01;
        const r = t * 60;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 0, ${1 - t})`;
        ctx.fill();
      }
    }
    
    ctx.restore();
  }
  
  function drawBranch(x, y, angle, len, depth, color) {
    if (depth <= 0 || len < 2) return;
    
    const x2 = x + Math.cos(angle) * len;
    const y2 = y + Math.sin(angle) * len;
    
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, depth);
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    if (depth > 1) {
      drawBranch(x2, y2, angle - 0.5, len * 0.7, depth - 1, color);
      drawBranch(x2, y2, angle + 0.5, len * 0.7, depth - 1, color);
    }
  }
  
  function drawMiniFractal(ox, oy, size, color, rot) {
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(rot);
    
    // Julia-style mini
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const r = size;
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * r, Math.sin(angle) * r, 3, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = color;
      ctx.fill();
    }
    
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    
    ctx.restore();
  }
  
  // Animation Loop
  function animate() {
    frame++;
    if (!paused) {
      drawFractal();
      updatePackets();
    }
    requestAnimationFrame(animate);
  }
  
  // Start
  init();
</script>
