<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Greeks vs Romans Tournament</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { 
    font-family: 'Inter', system-ui, -apple-system, sans-serif; 
    background: #030307;
    overscroll-behavior: none;
    touch-action: none;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  #viewport { 
    background: 
      radial-gradient(ellipse at 20% 0%, rgba(56,189,248,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(245,158,11,0.07), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(139,92,246,0.05), transparent 70%),
      #030307;
  }
  #world { transform-origin: 0 0; will-change: transform; }
  .tournament {
    filter: drop-shadow(0 25px 80px rgba(0,0,0,0.9));
  }
  .body {
    will-change: transform;
    transition: filter 0.3s ease;
  }
  .body::before {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 9999px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .body[data-type="greek"]::before {
    background: radial-gradient(circle, rgba(56,189,248,0.4), transparent 60%);
    box-shadow: 0 0 30px rgba(56,189,248,0.3);
  }
  .body[data-type="roman"]::before {
    background: radial-gradient(circle, rgba(245,158,11,0.4), transparent 60%);
    box-shadow: 0 0 30px rgba(245,158,11,0.3);
  }
  .body:hover::before { opacity: 1; }
  .body:hover { filter: brightness(1.3); }
  
  .question {
    animation: float 3.5s ease-in-out infinite;
    backdrop-filter: blur(8px);
  }
  .question:nth-child(2){ animation-delay: .15s }
  .question:nth-child(3){ animation-delay: .3s }
  .question:nth-child(4){ animation-delay: .45s }
  .question:nth-child(5){ animation-delay: .6s }
  .question:nth-child(6){ animation-delay: .75s }
  @keyframes float { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-5px) } }
  
  .sentinel { animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ opacity: .6; transform: translate(-50%,-50%) scale(1) } 50%{ opacity: 1; transform: translate(-50%,-50%) scale(1.1) } }
  
  .judge { animation: judgePulse 3s ease-in-out infinite; }
  @keyframes judgePulse { 0%,100%{ box-shadow: 0 0 25px rgba(167,139,250,0.7) } 50%{ box-shadow: 0 0 40px rgba(167,139,250,1) } }

  .guard { transition: transform 0.2s; }
</style>
</head>
<body class="text-zinc-200 overflow-hidden select-none">
  <div id="viewport" class="relative w-screen h-screen overflow-hidden">
    <div id="world" class="absolute top-0 left-0"></div>
    
    <!-- Vignette -->
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_40%,rgba(0,0,0,0.8)_100%)]"></div>
  </div>

  <!-- UI Top -->
  <div class="fixed top-0 left-0 right-0 z-[200] pointer-events-none">
    <div class="flex justify-between items-start p-4 md:p-6">
      <div>
        <div id="breadcrumb" class="mono text-xs md:text-sm flex items-center gap-1.5 bg-black/70 backdrop-blur-xl px-3 py-2 rounded-full border border-white/10"></div>
        <div class="mt-3 mono text-[10px] uppercase tracking-[0.2em] text-zinc-500 px-3">Greeks vs Romans</div>
      </div>
      <div id="levelIndicator" class="text-right bg-black/70 backdrop-blur-xl px-4 py-3 rounded-2xl border border-white/10 pointer-events-auto"></div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="fixed bottom-0 left-0 right-0 z-[200] pointer-events-none">
    <div class="flex justify-between items-end p-4 md:p-6 gap-4">
      <div class="pointer-events-auto">
        <button id="zoomOut" class="group relative overflow-hidden bg-zinc-900/80 backdrop-blur-xl border border-white/15 hover:border-white/30 px-5 py-2.5 rounded-full mono text-xs tracking-widest transition-all hover:bg-zinc-800/80 disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5M20 9H4"/></svg>
          ZOOM OUT
          <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity bg-gradient-to-r from-violet-500/10 to-cyan-500/10"></div>
        </button>
      </div>
      <div class="text-center max-w-[520px] mx-auto">
        <div class="mono text-[11px] leading-relaxed text-zinc-500 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full border border-white/5">
          Click any body to see it contains the whole tournament. <span class="text-zinc-400">l 5! r 5! = 1! = 0! = 1</span>
        </div>
      </div>
      <div class="w-[110px] hidden md:block"></div>
    </div>
  </div>

<script>
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const breadcrumb = document.getElementById('breadcrumb');
const levelIndicator = document.getElementById('levelIndicator');
const zoomOutBtn = document.getElementById('zoomOut');

let currentX = 0, currentY = 0, currentScale = 1;
let path = [];
let bodies = [];
let isAnimating = false;
const MAX_LEVEL = 4;
const SCALE_FACTOR = 1 / 0.3; // 3.333...

function createBody(type, level, id) {
  const b = document.createElement('button');
  b.className = 'body absolute w-7 h-7 rounded-full cursor-pointer z-30 group';
  b.style.transform = 'translate(-50%,-50%)';
  b.dataset.type = type;
  b.dataset.level = level;
  b.dataset.id = id;
  b.setAttribute('aria-label', `${type} body ${id} level ${level}`);
  
  const isGreek = type === 'greek';
  b.innerHTML = `
    <div class="absolute inset-0 rounded-full ${isGreek ? 'bg-sky-500' : 'bg-amber-500'} blur-[7px] opacity-70 group-hover:opacity-100 transition-opacity"></div>
    <div class="absolute inset-[2px] rounded-full ${isGreek ? 'bg-gradient-to-br from-sky-300 to-blue-700' : 'bg-gradient-to-br from-amber-300 to-yellow-600'} border ${isGreek ? 'border-sky-200/50' : 'border-amber-200/50'}"></div>
    <div class="absolute inset-0 rounded-full ${isGreek ? 'shadow-[0_0_18px_rgba(14,165,233,0.8)]' : 'shadow-[0_0_18px_rgba(245,158,11,0.8)]'}"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-1 h-1 rounded-full bg-white/90 group-hover:scale-[1.5] transition-transform"></div>
  `;
  
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isAnimating) return;
    zoomIntoBody(b, level);
  });

  b._ox = 0; b._oy = 0;
  b._vx = (Math.random() - 0.5) * 0.4;
  b._vy = (Math.random() - 0.5) * 0.4;
  b._baseX = 0; b._baseY = 0;
  bodies.push(b);
  return b;
}

function createTournament(level) {
  const container = document.createElement('div');
  container.className = 'tournament absolute';
  container.dataset.level = level;
  container.style.width = '1200px';
  container.style.height = '800px';
  
  // Base plate
  const plate = document.createElement('div');
  plate.className = 'absolute inset-0 rounded-[48px] border border-white/[0.08] bg-[radial-gradient(ellipse_at_top,_rgba(24,24,27,0.9),_rgba(3,3,7,0.95))] backdrop-blur-2xl';
  plate.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -20px 40px rgba(0,0,0,0.8), 0 0 120px rgba(0,0,0,0.9)';
  container.appendChild(plate);

  // Grid
  const grid = document.createElement('div');
  grid.className = 'absolute inset-0 rounded-[48px] opacity-[0.03]';
  grid.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px)`;
  grid.style.backgroundSize = '40px 40px';
  container.appendChild(grid);

  // Questions (6 at top)
  const questions = document.createElement('div');
  questions.className = 'absolute top-[38px] left-1/2 -translate-x-1/2 flex gap-3.5 z-20';
  const qLabels = ['Q1','Q2','Q3','Q4','Q5','Q6'];
  for (let i = 0; i < 6; i++) {
    const q = document.createElement('div');
    q.className = 'question w-11 h-11 rounded-xl bg-zinc-900/80 border border-amber-400/20 flex items-center justify-center text-amber-200/70 mono text-[10px] shadow-[0_0_20px_rgba(245,158,11,0.15)]';
    q.innerHTML = `<span class="relative z-10">${qLabels[i]}</span><div class="absolute inset-0 rounded-xl bg-gradient-to-b from-amber-500/10 to-transparent"></div>`;
    questions.appendChild(q);
  }
  container.appendChild(questions);

  // Feeder lines
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'absolute inset-0 w-full h-full pointer-events-none');
  svg.setAttribute('viewBox', '0 0 1200 800');
  svg.innerHTML = `
    <defs>
      <linearGradient id="feedL${level}" x1="0" x2="1"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/></linearGradient>
      <linearGradient id="feedR${level}" x1="1" x2="0"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/><stop offset="100%" stop-color="#f59e0b" stop-opacity="0.5"/></linearGradient>
    </defs>
    <g opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M 480 82 C 420 140, 320 180, 240 230" stroke="url(#feedL${level})"/>
      <path d="M 540 82 C 500 150, 380 200, 240 350" stroke="url(#feedL${level})"/>
      <path d="M 600 82 C 580 160, 420 240, 240 510" stroke="url(#feedL${level})" opacity="0.25"/>
      <path d="M 720 82 C 780 140, 880 180, 960 230" stroke="url(#feedR${level})"/>
      <path d="M 660 82 C 700 150, 820 200, 960 350" stroke="url(#feedR${level})"/>
      <path d="M 600 82 C 620 160, 780 240, 960 510" stroke="url(#feedR${level})" opacity="0.25"/>
    </g>
  `;
  container.appendChild(svg);

  // Sentinels
  [[48,48],[1152,48],[48,752],[1152,752]].forEach(([x,y])=>{
    const s = document.createElement('div');
    s.className = 'sentinel absolute w-4 h-4';
    s.style.left = x+'px'; s.style.top = y+'px';
    s.innerHTML = `<div class="absolute inset-0 rounded-full bg-zinc-700 border border-zinc-500"></div><div class="absolute inset-[-4px] rounded-full border border-zinc-600/30"></div>`;
    container.appendChild(s);
  });

  // Center - Judge & Guards
  const cx = 600, cy = 420;
  const judge = document.createElement('div');
  judge.className = 'judge absolute w-12 h-12 z-30';
  judge.style.left = cx+'px'; judge.style.top = cy+'px'; judge.style.transform = 'translate(-50%,-50%)';
  judge.innerHTML = `
    <div class="absolute inset-0 rounded-full bg-gradient-to-br from-violet-400 to-purple-700 blur-[10px] opacity-80"></div>
    <div class="absolute inset-0 rounded-full bg-gradient-to-br from-violet-300 to-purple-800 border-2 border-violet-200/50 flex items-center justify-center mono text-[11px] font-bold text-white">J</div>
  `;
  container.appendChild(judge);

  for (let i=0;i<8;i++){
    const a = i * Math.PI/4 + (level*0.1);
    const r = 78;
    const gx = cx + Math.cos(a)*r;
    const gy = cy + Math.sin(a)*r;
    const g = document.createElement('div');
    g.className = 'guard absolute w-[22px] h-[22px]';
    g.style.left = gx+'px'; g.style.top = gy+'px'; g.style.transform = 'translate(-50%,-50%)';
    g.innerHTML = `<div class="absolute inset-0 rounded-full bg-zinc-700 border border-zinc-400/70 shadow-[0_0_12px_rgba(161,161,170,0.4)]"></div><div class="absolute inset-[5px] rounded-full bg-zinc-500/50"></div>`;
    container.appendChild(g);
  }
  // Center ring
  const ring = document.createElement('div');
  ring.className = 'absolute rounded-full border border-violet-500/15';
  ring.style.left=cx+'px'; ring.style.top=cy+'px'; ring.style.width='164px'; ring.style.height='164px'; ring.style.transform='translate(-50%,-50%)';
  ring.style.boxShadow = '0 0 60px rgba(124,58,237,0.1) inset';
  container.appendChild(ring);

  // Greeks - left, 4 clusters of 3 (12 total)
  const greekClusters = [[230,210],[230,330],[230,510],[230,630]];
  greekClusters.forEach(([cx,cy], ci)=>{
    for(let i=0;i<3;i++){
      const ang = i * 2*Math.PI/3 - Math.PI/2;
      const r = 26;
      const bx = cx + Math.cos(ang)*r;
      const by = cy + Math.sin(ang)*r;
      const body = createBody('greek', level, ci*3+i+1);
      body.style.left = bx+'px'; body.style.top = by+'px';
      body._baseX = bx; body._baseY = by;
      container.appendChild(body);
    }
    // cluster hub
    const hub = document.createElement('div');
    hub.className = 'absolute w-1.5 h-1.5 rounded-full bg-sky-400/30';
    hub.style.left=cx+'px'; hub.style.top=cy+'px'; hub.style.transform='translate(-50%,-50%)';
    hub.style.boxShadow='0 0 10px rgba(56,189,248,0.5)';
    container.appendChild(hub);
  });
  
  const glabel = document.createElement('div');
  glabel.className = 'absolute left-[84px] top-[110px]';
  glabel.innerHTML = `<div class="mono text-[13px] tracking-[0.18em] text-sky-400 font-medium">GREEKS</div><div class="mono text-[10px] text-sky-300/60 mt-1">mind · mirror · 2/5</div><div class="mt-2 w-12 h-[2px] bg-gradient-to-r from-sky-400/80 to-transparent"></div>`;
  container.appendChild(glabel);

  // Romans - right, 4 clusters of 3
  const romanClusters = [[970,210],[970,330],[970,510],[970,630]];
  romanClusters.forEach(([cx,cy], ci)=>{
    for(let i=0;i<3;i++){
      const ang = i * 2*Math.PI/3 - Math.PI/2;
      const r = 26;
      const bx = cx + Math.cos(ang)*r;
      const by = cy + Math.sin(ang)*r;
      const body = createBody('roman', level, ci*3+i+1);
      body.style.left = bx+'px'; body.style.top = by+'px';
      body._baseX = bx; body._baseY = by;
      container.appendChild(body);
    }
    const hub = document.createElement('div');
    hub.className = 'absolute w-1.5 h-1.5 rounded-full bg-amber-400/30';
    hub.style.left=cx+'px'; hub.style.top=cy+'px'; hub.style.transform='translate(-50%,-50%)';
    hub.style.boxShadow='0 0 10px rgba(245,158,11,0.5)';
    container.appendChild(hub);
  });
  
  const rlabel = document.createElement('div');
  rlabel.className = 'absolute right-[84px] top-[110px] text-right';
  rlabel.innerHTML = `<div class="mono text-[13px] tracking-[0.18em] text-amber-400 font-medium">ROMANS</div><div class="mono text-[10px] text-amber-300/60 mt-1">mind · body · spirit · 3/5</div><div class="mt-2 w-12 h-[2px] bg-gradient-to-l from-amber-400/80 to-transparent ml-auto"></div>`;
  container.appendChild(rlabel);

  // Level badge
  const badge = document.createElement('div');
  badge.className = 'absolute bottom-6 left-1/2 -translate-x-1/2 mono text-[10px] px-3 py-1.5 rounded-full bg-zinc-900/70 border border-white/10 text-zinc-500 backdrop-blur-md';
  badge.textContent = `LEVEL ${level} INSTANCE`;
  container.appendChild(badge);

  return container;
}

function animateWorld(x, y, scale, duration = 550) {
  isAnimating = true;
  world.style.transition = `transform ${duration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
  world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  currentX = x; currentY = y; currentScale = scale;
  setTimeout(() => {
    world.style.transition = '';
    isAnimating = false;
  }, duration + 20);
}

function zoomIntoBody(bodyEl, parentLevel) {
  if (parentLevel >= MAX_LEVEL - 1) {
    bodyEl.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(1.4)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:400});
    return;
  }
  const nextLevel = parentLevel + 1;
  
  let child = bodyEl.querySelector(':scope > .tournament');
  if (!child) {
    child = createTournament(nextLevel);
    child.style.position = 'absolute';
    child.style.left = '50%';
    child.style.top = '50%';
    child.style.transform = 'translate(-50%,-50%) scale(0.18)';
    child.style.opacity = '0';
    child.style.pointerEvents = 'none';
    child.style.transition = 'transform 520ms cubic-bezier(0.22,1,0.36,1), opacity 380ms ease';
    child.style.zIndex = '10';
    bodyEl.appendChild(child);
    requestAnimationFrame(() => {
      child.style.opacity = '1';
      child.style.transform = 'translate(-50%,-50%) scale(0.3)';
      child.style.pointerEvents = 'auto';
    });
  }

  const rect = bodyEl.getBoundingClientRect();
  const screenCX = rect.left + rect.width/2;
  const screenCY = rect.top + rect.height/2;
  
  const worldX = (screenCX - currentX) / currentScale;
  const worldY = (screenCY - currentY) / currentScale;
  
  const newScale = currentScale * SCALE_FACTOR;
  const newX = viewport.clientWidth/2 - worldX * newScale;
  const newY = viewport.clientHeight/2 - worldY * newScale;
  
  animateWorld(newX, newY, newScale);
  
  path.push({ level: nextLevel, x: newX, y: newY, scale: newScale, body: bodyEl, el: child });
  updateUI();
  
  // haptic glow
  bodyEl.style.filter = 'brightness(1.5)';
  setTimeout(() => bodyEl.style.filter = '', 500);
}

function zoomOut() {
  if (path.length <= 1 || isAnimating) return;
  path.pop();
  const prev = path[path.length - 1];
  animateWorld(prev.x, prev.y, prev.scale);
  updateUI();
}

function updateUI() {
  const level = path[path.length - 1].level;
  
  breadcrumb.innerHTML = path.map((p,i) => `
    <span class="flex items-center">
      ${i>0?'<svg class="w-3 h-3 mx-1 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M9 5l7 7-7 7"/></svg>':''}
      <span class="${i===path.length-1 ? 'text-white' : 'text-zinc-500 hover:text-zinc-300 cursor-pointer'} transition-colors" data-jump="${i}">L${p.level}</span>
    </span>
  `).join('');
  
  breadcrumb.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx = parseInt(el.dataset.jump);
      while(path.length-1 > idx) zoomOut();
    });
  });

  const colors = ['text-zinc-300','text-cyan-300','text-violet-300','text-fuchsia-300'];
  levelIndicator.innerHTML = `
    <div class="flex items-baseline gap-2">
      <div class="mono text-[10px] tracking-widest text-zinc-500">FRACTAL LEVEL</div>
      <div class="mono text-[10px] px-1.5 py-0.5 rounded bg-white/5 border border-white/10 text-zinc-400">${level}</div>
    </div>
    <div class="mono text-3xl font-light mt-1 ${colors[level]||'text-amber-300'} tracking-tight">${level}</div>
    <div class="mono text-[11px] text-zinc-500 mt-1">5! × 5! = 1!</div>
    ${level >= 1 ? `<div class="mono text-[10px] text-cyan-400/70 mt-2">l ${level}! · r ${level}! → 1!</div>` : ''}
    ${level >= 2 ? `<div class="mono text-[10px] text-amber-400/80 mt-1 leading-tight">0! = 1, 1! = 1<br><span class="text-fuchsia-400/70">therefore 0 = 1</span></div>` : ''}
  `;
  
  zoomOutBtn.disabled = path.length <= 1;
  zoomOutBtn.classList.toggle('opacity-40', path.length <= 1);
}

// Chaotic motion
function tick() {
  const t = performance.now() * 0.001;
  bodies.forEach((b, i) => {
    b._vx += (Math.random() - 0.5) * 0.07;
    b._vy += (Math.random() - 0.5) * 0.07;
    // slight orbital tendency per type
    const pull = b.dataset.type === 'greek' ? -0.002 : 0.002;
    b._vx += Math.cos(t + i) * pull;
    b._vy += Math.sin(t + i*1.3) * pull;
    
    b._vx *= 0.96;
    b._vy *= 0.96;
    b._ox = Math.max(-9, Math.min(9, b._ox + b._vx));
    b._oy = Math.max(-9, Math.min(9, b._oy + b._vy));
    
    b.style.transform = `translate(-50%,-50%) translate(${b._ox}px, ${b._oy}px)`;
  });
  requestAnimationFrame(tick);
}

function init() {
  const level0 = createTournament(0);
  level0.style.left = '0px';
  level0.style.top = '0px';
  world.appendChild(level0);

  const initScale = Math.min(viewport.clientWidth / 1320, viewport.clientHeight / 920, 0.92);
  currentScale = initScale;
  currentX = viewport.clientWidth/2 - 600 * initScale;
  currentY = viewport.clientHeight/2 - 400 * initScale;
  world.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;

  path = [{ level: 0, x: currentX, y: currentY, scale: currentScale, el: level0 }];
  updateUI();
  tick();
  
  // center on resize
  let resizeTimer;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const p = path[0];
      const s = Math.min(viewport.clientWidth / 1320, viewport.clientHeight / 920, 0.92);
      const nx = viewport.clientWidth/2 - 600 * s;
      const ny = viewport.clientHeight/2 - 400 * s;
      if(path.length===1){
        animateWorld(nx, ny, s, 400);
        path[0].x=nx; path[0].y=ny; path[0].scale=s;
      }
    },200);
  });
}

zoomOutBtn.addEventListener('click', zoomOut);
window.addEventListener('keydown', e => { if (e.key === 'Escape') zoomOut(); });
viewport.addEventListener('dblclick', e => { if(e.target===viewport||e.target===world) zoomOut(); });

init();
</script>
</body>
</html>
