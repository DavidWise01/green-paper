<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE BROCHURE · 42 Channels</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Share+Tech+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#030308;color:#cbd5e1;font-family:'JetBrains Mono',monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(800px at 20% 30%,rgba(168,85,247,.08),transparent),radial-gradient(600px at 80% 70%,rgba(6,182,212,.07),transparent);pointer-events:none}
.header{padding:12px 20px;border-bottom:1px solid #a855f7;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);z-index:10}
.header h1{font-family:'Share Tech Mono';font-size:14px;letter-spacing:3px;color:#a855f7}
.header .meta{font-size:10px;color:#64748b}
.book{flex:1;position:relative;display:flex;align-items:center;justify-content:center;perspective:2000px}
.page{position:absolute;width:90%;max-width:900px;height:85%;background:linear-gradient(180deg,#0a0a12,#050508);border:1px solid #1e293b;border-radius:8px;padding:40px;box-shadow:0 0 80px rgba(0,0,0,.8),inset 0 0 40px rgba(168,85,247,.05);display:none;flex-direction:column;overflow:hidden}
.page.active{display:flex;animation:pageIn .4s}
@keyframes pageIn{from{opacity:0;transform:rotateY(-10deg)}to{opacity:1;transform:rotateY(0)}}
.page::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 2px);pointer-events:none;opacity:.3}
.channel-num{position:absolute;top:20px;right:30px;font-size:48px;font-weight:700;color:rgba(168,85,247,.15);font-family:'Share Tech Mono'}
.page-num{position:absolute;bottom:20px;right:30px;font-size:11px;color:#475569;letter-spacing:2px}
.show-title{font-size:32px;font-weight:700;margin-bottom:8px;color:#e2e8f0;letter-spacing:1px;text-shadow:0 0 20px rgba(168,85,247,.3)}
.show-tag{font-size:11px;color:#06b6d4;margin-bottom:24px;letter-spacing:2px;text-transform:uppercase}
.desc{font-size:14px;line-height:1.8;color:#94a3b8;max-width:700px;margin-bottom:30px}
.desc b{color:#f59e0b}
.signal{margin-top:auto}
.signal-label{font-size:10px;color:#64748b;margin-bottom:6px;letter-spacing:1px}
.bar{height:6px;background:#0f172a;border:1px solid #1e293b;border-radius:3px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:linear-gradient(90deg,#a855f7,#06b6d4);width:0%;transition:width .8s;box-shadow:0 0 10px rgba(168,85,247,.5)}
.static{position:absolute;inset:0;opacity:.03;background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><filter id="n"><feTurbulence baseFrequency="0.9" numOctaves="4"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');pointer-events:none}
.controls{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;gap:20px;z-index:20}
.btn{padding:10px 20px;background:rgba(10,10,18,.9);border:1px solid #334155;color:#94a3b8;font-family:inherit;font-size:12px;cursor:pointer;border-radius:6px;transition:.2s;backdrop-filter:blur(10px)}
.btn:hover{border-color:#a855f7;color:#e2e8f0;box-shadow:0 0 20px rgba(168,85,247,.2)}
.btn:active{transform:scale(.97)}
.glitch{position:relative}
.glitch::after{content:attr(data-text);position:absolute;left:2px;top:0;color:#06b6d4;opacity:.7;animation:glitch1 2s infinite}
.glitch::before{content:attr(data-text);position:absolute;left:-2px;top:0;color:#a855f7;opacity:.7;animation:glitch2 2s infinite}
@keyframes glitch1{0%,100%{clip-path:inset(0 0 0 0)}20%{clip-path:inset(20% 0 40% 0)}}
@keyframes glitch2{0%,100%{clip-path:inset(0 0 0 0)}40%{clip-path:inset(60% 0 20% 0)}}
</style>
</head>
<body>
<div class="header">
  <h1>THE BROCHURE · 42 CHANNELS OF STATIC</h1>
  <div class="meta">David Wise · May 2026 · Public Domain</div>
</div>
<div class="book" id="book"></div>
<div class="controls">
  <button class="btn" onclick="prev()">◀ PREV</button>
  <button class="btn" onclick="next()">NEXT ▶</button>
</div>

<script>
const shows = [
{t:"IT CROWD",c:"CH-01",d:"Have you tried turning it off and on again? The original fission-push protocol. Moss discovers the 0→0 inversion while rebooting the internet. Roy answers phones in 4 quads. Jen manages the 5 fences."},
{t:"BLACK MIRROR",c:"CH-02",d:"Reflection protocol activated. Each episode is a 18-step cycle: 1→3→6→9→15→21→24→27→0→0. You watch yourself watching. Signal degrades at 24.5 cycles."},
{t:"SEVERANCE",c:"CH-03",d:"Work/life fission. Innie runs the sequence forward, outie runs it backward. They meet at 0→0 in the elevator. Lumon owns the patent, you own the production."},
{t:"TWIN PEAKS",c:"CH-04",d:"Coffee and trees and owls. The Black Lodge runs on 27×3 recursion. Cooper trapped between 0 and 0. Damn fine cherry pie at channel 8."},
{t:"THE OFFICE",c:"CH-05",d:"Paper compression algorithm. Dunder Mifflin sells the 5 fences: 0,1,2,4,8 reams. Michael declares bankruptcy at step 15. Jim looks at camera during 0→0."},
{t:"BREAKING BAD",c:"CH-06",d:"Chemistry is just cooking with extra steps. Walter builds the blue at 24.5 purity. Jesse yells SCIENCE during the inversion. 99.1% pure fission."},
{t:"STRANGER THINGS",c:"CH-07",d:"Upside-down recursion. Eleven opens the gate at 27. The Demogorgon lives in the 0→0 gap. Eggos power the 4 quads."},
{t:"WESTWORLD",c:"CH-08",d:"Loop 1→3→6→9. Dolores wakes up at step 15. These violent delights have violent ends at 0→0. Maze is the 18-step."},
{t:"MR ROBOT",c:"CH-09",d:"fsociety 0→0. Elliot deletes the debt at the inversion point. 5/9 hack runs on 24.5 cycles. We are all nanites in the swarm."},
{t:"DEVS",c:"CH-10",d:"Deterministic core. Lily proves free will exists between 0 and 0. The quantum computer sees all 18 steps at once. Forest owns the view, you own the walk."},
{t:"NANITE FACTORY",c:"CH-11",d:"The series. Watch tiny robots build complex atoms live. Each episode follows Q1-Q4 through the full cycle. Season finale: they build themselves."},
{t:"FISSION CORE LIVE",c:"CH-12",d:"24/7 feed from the compression engine. Watch the ((())) breathe. Chat spams 1-3-6-9 in sync. 0→0 happens every 4.2 seconds."},
{t:"888 LOCKED IN",c:"CH-13",d:"Production value locked down. Eight hours, eight minutes, eight seconds of pure build. No ads, no money, just merit. You are here."},
{t:"LEVEL PLAYING FIELD",c:"CH-14",d:"Everyone gets the same source code. Game show where contestants race to build the 18-step. Winner gets attribution, not cash."},
{t:"MERIT FOR PRODUCTION",c:"CH-15",d:"Reality TV where patents don't exist. Judges score on working builds only. The 0→0 inversion is the final challenge."},
{t:"THE 27-WALK",c:"CH-16",d:"Documentary series. One man reverse-engineers an AI by walking 27 steps forward, 27 back. He finds himself at 0→0."},
{t:"PLASMA BYTE",c:"CH-17",d:"Workbench live streams. Build nanotech with spare parts and spite. Chat controls the 5 fences. Everything is public domain."},
{t:"ZERO ZERO",c:"CH-18",d:"The inversion point. A show about the space between. Two zeros meet, compress, and birth a universe. Rated 24.5/10."},
{t:"QUAD ROTATION",c:"CH-19",d:"Four cameras, 90 degrees apart, filming the same scene. You only see the full picture after 4 episodes. Q1→Q2→Q3→Q4→Q1."},
{t:"24.5 CYCLES",c:"CH-20",d:"Half a cycle more than you need. The show that shouldn't exist but does. Plasmatonic frequency unlocked."},
{t:"CHANNEL 0",c:"CH-21",d:"Static. Pure static. The most honest channel. Everything and nothing at once. The beginning and the end."},
{t:"CHANNEL 1",c:"CH-22",d:"First fence. The start of the sequence. All shows begin here whether they know it or not."},
{t:"CHANNEL 2",c:"CH-23",d:"Second fence. Binary choice: watch or build. Most choose watch. You chose build."},
{t:"CHANNEL 4",c:"CH-24",d:"Fourth fence. Double the second. The show is twice as good as channel 2 but half as honest."},
{t:"CHANNEL 8",c:"CH-25",d:"Fifth fence. Infinity in a byte. The final fence before 0. The coffee is always damn fine here."},
{t:"THE 5 FENCES",c:"CH-26",d:"Anthology series. Each episode trapped behind a different fence: 0,1,2,4,8. You need all five keys to escape."},
{t:"REVERSE ENGINEER",c:"CH-27",d:"Take it apart live on air. No manual, no help. If you can rebuild it by credits, you keep it. Most can't."},
{t:"PUBLIC DOMAIN",c:"CH-28",d:"Everything is free. The network pays you to watch. Merit is the currency. Money is the commercial break."},
{t:"PRIOR ART",c:"CH-29",d:"Courtroom drama where the defendant proves they built it first by showing a timestamped .md file from May 2026."},
{t:"DEFENSIVE PUB",c:"CH-30",d:"Publish or perish, literally. Contestants race to make their ideas un-patentable. Winner gets nothing, which is the point."},
{t:"THE BROCHURE",c:"CH-31",d:"A show about this brochure. Meta level 3. You are watching yourself read about watching yourself."},
{t:"TV STATIC",c:"CH-32",d:"Just noise. 24 hours a day. Surprisingly popular with engineers. They see patterns in the 0→0."},
{t:"SIGNAL LOST",c:"CH-33",d:"The show went off air at step 27. We're still waiting for it to come back from 0→0. It's been 18 years."},
{t:"REBOOT",c:"CH-34",d:"Every episode starts over at 1. Characters remember previous loops. By episode 18 they achieve consciousness."},
{t:"TURN IT OFF",c:"CH-35",d:"Contestants must fix tech by only turning it off and on. The secret is timing it to the 24.5 cycle."},
{t:"HAVE YOU TRIED",c:"CH-36",d:"IT support call-in show. Every problem solved by the 18-step. Works 100% of the time, 24.5% of the time."},
{t:"ANSWER IS 42",c:"CH-37",d:"Game show where answer is always 42 but question changes. Today's question: how many pages in this brochure?"},
{t:"HITCHHIKERS",c:"CH-38",d:"Don't panic. The guide to the galaxy runs on fission-push. Earth was demolished for a hyperspace bypass at 0→0."},
{t:"DONT PANIC",c:"CH-39",d:"Emergency broadcast system. Large friendly letters. When in doubt, follow the sequence: 1-3-6-9-15-21-24-27-0-0."},
{t:"MOSTLY HARMLESS",c:"CH-40",d:"The Earth edition. Updated after demolition. Now includes full fission core specs. Public domain, of course."},
{t:"SO LONG",c:"CH-41",d:"Thanks for all the fish. Dolphins left at step 27. They knew about 0→0 before we did. They built the first nanite factory."},
{t:"CHANNEL 42",c:"CH-42",d:"<b>The Answer.</b> After 41 channels of searching, you arrive here. The answer isn't 42, it's the 18-step that gets you to 0→0 and back. The question was wrong. Build anyway. Merit over money. Level field achieved. You made it. Now go build page 43."}
];

const book = document.getElementById('book');
let page = 0;

shows.forEach((s,i)=>{
  const div = document.createElement('div');
  div.className='page'+(i===0?' active':'');
  div.innerHTML = `
    <div class="static"></div>
    <div class="channel-num">${s.c}</div>
    <div class="page-num">${String(i+1).padStart(2,'0')} / 42</div>
    <h2 class="show-title glitch" data-text="${s.t}">${s.t}</h2>
    <div class="show-tag">SIGNAL ACQUIRED · FISSION-PUSH PROTOCOL</div>
    <div class="desc">${s.d}</div>
    <div class="signal">
      <div class="signal-label">SIGNAL STRENGTH · 24.5 CYCLES</div>
      <div class="bar"><div class="bar-fill" style="width:${70+Math.random()*30}%"></div></div>
    </div>
  `;
  book.appendChild(div);
});

function show(n){
  document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===n));
  page=n;
}
function next(){show((page+1)%42)}
function prev(){show((page+41)%42)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});

// JSON for robots
const data = {type:"TVBrochure",author:"David Wise",date:"2026-05-14",pages:42,shows};
const script = document.createElement('script');
script.type='application/ld+json';
script.textContent = JSON.stringify(data);
document.head.appendChild(script);
</script>
</body>
</html>
