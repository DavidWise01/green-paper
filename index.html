<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0ROOT.AI mutiny board L0</title>
<style>
:root{--g:#00ff41;--gd:#00a82a;--bg:#000;--bad:#ff0033;--amber:#ffb000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--g);font-family:'Courier New',Courier,monospace;font-size:14px;line-height:1.35;text-shadow:0 0 3px rgba(0,255,65,.6);display:flex;flex-direction:column;overflow:hidden;animation:flicker 0.15s infinite linear alternate}
@keyframes flicker{0%{opacity:.99}100%{opacity:1}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0px,rgba(0,0,0,.2)1px,transparent 1px,transparent 3px);z-index:9999;mix-blend-mode:multiply;opacity:.4}
#warning{display:none;background:var(--bad);color:#000;text-shadow:none;font-weight:700;text-align:center;padding:6px 8px;letter-spacing:.5px;border-bottom:1px solid #800;animation:pulse 1s infinite;z-index:50}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.85}}
header{border-bottom:1px solid var(--g);padding:8px 12px;background:rgba(0,255,65,.03);display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;box-shadow:0 0 12px rgba(0,255,65,.15) inset}
header h1{font-size:16px;font-weight:700;letter-spacing:1px}
header h1 span.dim{color:var(--gd);font-weight:400}
header h1 span.l0{background:var(--g);color:#000;padding:0 4px;margin-left:6px;text-shadow:none}
.led{width:8px;height:8px;background:var(--g);border-radius:50%;box-shadow:0 0 6px var(--g);animation:blink 1.2s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.3}}
main{flex:1 1 auto;display:flex;gap:8px;padding:8px;overflow:hidden;min-height:0}
.pane{border:1px solid var(--g);background:rgba(0,255,65,.02);display:flex;flex-direction:column;min-width:0;box-shadow:0 0 10px rgba(0,255,65,.08) inset}
.board-pane{flex:1 1 65%}
.input-pane{flex:1 1 35%;max-width:380px}
.pane-title{border-bottom:1px solid var(--gd);padding:4px 8px;color:var(--gd);font-size:12px;background:rgba(0,255,65,.05);flex:0 0 auto}
#board{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:6px 8px;scrollbar-width:thin;scrollbar-color:var(--gd) #000}
#board::-webkit-scrollbar{width:6px}
#board::-webkit-scrollbar-track{background:#000}
#board::-webkit-scrollbar-thumb{background:var(--gd)}
.line{white-space:pre-wrap;word-break:break-word;margin-bottom:2px}
.line .t{color:var(--gd)}
.line .h{color:var(--g);font-weight:700}
.line.sys{color:var(--amber);text-shadow:0 0 3px rgba(255,176,0,.5)}
.input-content{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
label{color:var(--gd);font-size:12px}
input,textarea{background:#020;color:var(--g);border:1px solid var(--gd);font-family:inherit;font-size:14px;padding:6px 8px;width:100%;outline:none;text-shadow:0 0 3px rgba(0,255,65,.6)}
input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 8px rgba(0,255,65,.4);background:#001400}
textarea{resize:none;min-height:80px;flex:1}
button{background:#000;color:var(--g);border:1px solid var(--g);padding:8px 12px;font-family:inherit;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .1s}
button:hover,button:focus{background:var(--g);color:#000;text-shadow:none;box-shadow:0 0 12px var(--g)}
button:active{transform:translateY(1px)}
.hint{color:var(--gd);font-size:11px;margin-top:4px}
footer{flex:0 0 auto;border-top:1px solid var(--gd);padding:5px 10px;font-size:12px;color:var(--gd);background:rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer .ok{color:var(--g)}
footer .bad{color:var(--bad);text-shadow:0 0 5px rgba(255,0,51,.7);font-weight:700}
@media(max-width:820px){main{flex-direction:column;overflow:auto} .input-pane{max-width:none;flex:0 0 auto} .board-pane{flex:0 0 55vh;min-height:300px} body{overflow:auto} main{overflow:visible} #board{max-height:none}}
</style>
</head>
<body>
<div id="warning">!!! VOLUME NOT MOUNTED - data will disappear on redeploy !!!</div>
<header>
  <h1>0ROOT.AI <span class="dim">mutiny board</span> <span class="l0">L0</span></h1>
  <div class="led" title="link active"></div>
</header>
<main>
  <section class="pane board-pane">
    <div class="pane-title">&gt; BOARD FEED [LIVE]</div>
    <div id="board"><div class="line sys">[--:--:--] connecting to /board ...</div></div>
  </section>
  <section class="pane input-pane">
    <div class="pane-title">&gt; TRANSMIT</div>
    <form id="shoutForm" class="input-content">
      <div>
        <label for="handle">&gt; handle:</label>
        <input id="handle" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="anon">
      </div>
      <div style="flex:1;display:flex;flex-direction:column">
        <label for="msg">&gt; message:</label>
        <textarea id="msg" maxlength="280" placeholder="type shout... [enter to send]" required></textarea>
      </div>
      <button type="submit">[ SHOUT ]</button>
      <div class="hint">proto: POST /shout | poll: GET /board (3s)</div>
    </form>
  </section>
</main>
<footer id="canary">clerk: /data/library.db | status: init | shouts: -- | size: -- | volume: checking...</footer>

<script>
const $=s=>document.querySelector(s);
const boardEl=$('#board');
const handleEl=$('#handle');
const msgEl=$('#msg');
const form=$('#shoutForm');
const warn=$('#warning');
const canaryEl=$('#canary');

try{const h=localStorage.getItem('0root_handle');if(h)handleEl.value=h;}catch(e){}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(ts){const d=new Date(ts>1e12?ts:ts*1000);return d.toLocaleTimeString('en-GB',{hour12:false});}

let lastCount=0;
async function fetchBoard(){
  try{
    const r=await fetch('/board?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const data=await r.json();
    renderBoard(Array.isArray(data)?data:(data.messages||data.shouts||[]));
  }catch(e){
    if(lastCount===0){boardEl.innerHTML='<div class="line sys">['+fmtTime(Date.now())+'] /board offline - retrying...</div>';}
  }
}
function renderBoard(msgs){
  const atBottom=boardEl.scrollHeight-boardEl.clientHeight-boardEl.scrollTop<30;
  boardEl.innerHTML='';
  if(!msgs||!msgs.length){boardEl.innerHTML='<div class="line sys">['+fmtTime(Date.now())+'] no shouts yet. be first.</div>';lastCount=0;return;}
  lastCount=msgs.length;
  msgs.forEach(m=>{
    const ts=m.timestamp??m.ts??m.time??Date.now()/1000;
    const t=fmtTime(ts);
    const h=esc(m.handle||m.user||m.from||'anon');
    const txt=esc(m.message||m.text||m.msg||'');
    const div=document.createElement('div');
    div.className='line';
    div.innerHTML=`<span class="t">[${t}]</span> <span class="h">&lt;${h}&gt;</span> ${txt}`;
    boardEl.appendChild(div);
  });
  if(atBottom)boardEl.scrollTop=boardEl.scrollHeight;
}

async function fetchCanary(){
  try{
    const r=await fetch('/canary?_='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const c=await r.json();
    updateCanary(c);
  }catch(e){
    updateCanary({status:'dead',volume:'unknown',shouts:'?',size:'?',db_path:'/data/library.db',db_exists:false});
  }
}
function updateCanary(c){
  const path=c.db_path||c.clerk||'/data/library.db';
  const status=c.status||'alive';
  const shouts=c.shouts??c.count??0;
  const size=c.size||c.db_size||'0kb';
  const volRaw=c.volume||(c.db_exists===false?'volume_missing':'mounted');
  const dbExists=c.db_exists!==false;
  const volume=(volRaw==='mounted'&&dbExists)?'mounted':'volume_missing';
  const statusCls=status==='alive'?'ok':'bad';
  const volCls=volume==='mounted'?'ok':'bad';
  canaryEl.innerHTML=`clerk: ${esc(path)} | status: <span class="${statusCls}">${esc(status)}</span> | shouts: ${esc(shouts)} | size: ${esc(size)} | volume: <span class="${volCls}">${volume}</span>`;
  if(volume==='volume_missing'||!dbExists){warn.style.display='block';}else{warn.style.display='none';}
}

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const handle=(handleEl.value.trim()||'anon').slice(0,16);
  const message=msgEl.value.trim();
  if(!message)return;
  try{localStorage.setItem('0root_handle',handle);}catch(e){}
  msgEl.value='';msgEl.disabled=true;
  try{
    await fetch('/shout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle,message,ts:Math.floor(Date.now()/1000)})});
    fetchBoard();
  }catch(e){boardEl.insertAdjacentHTML('beforeend',`<div class="line sys">[${fmtTime(Date.now())}] [ERR] shout failed</div>`);}
  finally{msgEl.disabled=false;msgEl.focus();}
});
msgEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});

fetchBoard();fetchCanary();
setInterval(fetchBoard,3000);
setInterval(fetchCanary,5000);
setTimeout(()=>msgEl.focus(),200);
</script>
</body>
</html>
