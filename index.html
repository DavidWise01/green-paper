<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>0root.ai // BBS</title>
<style>
:root {
  --green: #00ff41;
  --green-dim: #008f11;
  --green-dark: #001a06;
  --bg: #000000;
}
* { box-sizing: border-box; }
html,body { height:100%; margin:0; padding:0; }
body {
  background: var(--bg);
  color: var(--green);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  font-size: 15px;
  line-height: 1.4;
  text-shadow: 0 0 2px rgba(0,255,65,0.7), 0 0 10px rgba(0,255,65,0.2);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  position: relative;
}
/* CRT effects */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,255,65,0.04) 0px, rgba(0,255,65,0.04) 1px, transparent 2px, transparent 3px);
  pointer-events: none;
  z-index: 100;
  opacity: 0.6;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.9) 100%);
  pointer-events: none;
  z-index: 99;
}
a { color: var(--green); }
::selection { background: var(--green); color: #000; text-shadow: none; }

header {
  border-bottom: 1px solid var(--green);
  padding: 8px 14px;
  background: linear-gradient(180deg, rgba(0,255,65,0.12), rgba(0,255,65,0.03));
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  box-shadow: 0 0 15px rgba(0,255,65,0.15);
}
header .title {
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
header .status {
  font-size: 12px;
  opacity: 0.8;
}
.blink { animation: blink 1.2s step-end infinite; }
@keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

main {
  flex: 1;
  display: grid;
  grid-template-columns: 1.7fr 1fr;
  gap: 12px;
  padding: 12px;
  min-height: 0;
  width: 100%;
  max-width: 1600px;
  margin: 0 auto;
}
.panel {
  border: 1px solid var(--green);
  background: rgba(0,20,5,0.6);
  display: flex;
  flex-direction: column;
  min-height: 0;
  box-shadow: 0 0 20px rgba(0,255,65,0.08), inset 0 0 12px rgba(0,255,65,0.05);
  backdrop-filter: blur(1px);
}
.panel-header {
  padding: 6px 10px;
  border-bottom: 1px solid var(--green-dim);
  background: rgba(0,255,65,0.08);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.panel-header::before { content: '>'; opacity: 0.7; }

.feed {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 10px;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  scroll-behavior: smooth;
}
.shout { margin: 1px 0; }
.shout .time { color: var(--green-dim); margin-right: 8px; }
.shout .handle { color: var(--green); font-weight: 700; }
.shout .msg { color: #b6ffc7; }
.shout.sys { opacity: 0.7; font-style: italic; }

.transmit-panel .form {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  flex: 1;
  min-height: 0;
}
label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.8;
  margin-top: 2px;
}
input, textarea {
  width: 100%;
  background: #000703;
  border: 1px solid var(--green-dim);
  color: var(--green);
  padding: 8px 9px;
  font: inherit;
  font-size: 14px;
  outline: none;
  border-radius: 0;
  box-shadow: inset 0 0 10px rgba(0,255,65,0.08);
  caret-color: var(--green);
}
input:focus, textarea:focus {
  border-color: var(--green);
  box-shadow: inset 0 0 10px rgba(0,255,65,0.15), 0 0 8px rgba(0,255,65,0.25);
}
textarea {
  flex: 1;
  min-height: 140px;
  resize: vertical;
  line-height: 1.5;
}
button {
  background: var(--green);
  color: #000;
  border: 1px solid var(--green);
  padding: 10px 12px;
  font: inherit;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0,255,65,0.4), inset 0 0 4px rgba(0,0,0,0.3);
  transition: all 0.1s;
  text-shadow: none;
}
button:hover {
  background: #00e63a;
  box-shadow: 0 0 18px rgba(0,255,65,0.6), inset 0 0 4px rgba(0,0,0,0.3);
}
button:active { transform: translateY(1px); background: #00cc33; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.hint {
  font-size: 10px;
  opacity: 0.5;
  line-height: 1.3;
  margin-top: -2px;
}

footer {
  border-top: 1px solid var(--green-dim);
  padding: 6px 12px;
  font-size: 12px;
  background: rgba(0,255,65,0.04);
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* scrollbars */
.feed::-webkit-scrollbar, textarea::-webkit-scrollbar { width: 8px; }
.feed::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track { background: #000; }
.feed::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb { background: var(--green-dim); border: 1px solid #000; }
.feed::-webkit-scrollbar-thumb:hover, textarea::-webkit-scrollbar-thumb:hover { background: var(--green); }

/* mobile */
@media (max-width: 900px) {
  main {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    gap: 10px;
    padding: 10px;
  }
  .board-panel { order: 2; min-height: 45vh; }
  .transmit-panel { order: 1; }
  textarea { min-height: 100px; max-height: 180px; }
  header .status { display: none; }
  body { font-size: 14px; }
  .feed { font-size: 13px; }
}
</style>
</head>
<body>
<header>
  <div class="title">0root.ai :: bulletin board system</div>
  <div class="status">tty0 <span class="blink">█</span></div>
</header>

<main>
  <section class="panel board-panel">
    <div class="panel-header">board feed / live</div>
    <div id="feed" class="feed" aria-live="polite">
      <div class="shout sys">[SYSTEM] initializing terminal... awaiting /board</div>
    </div>
  </section>

  <section class="panel transmit-panel">
    <div class="panel-header">transmit / shout</div>
    <div class="form">
      <label for="handle">handle</label>
      <input id="handle" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="anon">

      <label for="message">message</label>
      <textarea id="message" rows="6" maxlength="512" placeholder="type message... enter to send, shift+enter for newline" spellcheck="false"></textarea>

      <button id="send" type="button">TRANSMIT</button>
      <div class="hint">protocol: POST /shout as JSON {handle, message} | cache: no-store | max 512 bytes</div>
    </div>
  </section>
</main>

<footer id="canary">clerk: /data/library.db | status: initializing | volume: checking...</footer>

<script>
(function() {
  const handleEl = document.getElementById('handle');
  const msgEl = document.getElementById('message');
  const sendBtn = document.getElementById('send');
  const feedEl = document.getElementById('feed');
  const canaryEl = document.getElementById('canary');

  // load handle
  const saved = localStorage.getItem('oroot_handle');
  handleEl.value = saved || 'anon';

  const saveHandle = () => {
    const h = (handleEl.value || '').trim().slice(0,16) || 'anon';
    localStorage.setItem('oroot_handle', h);
    handleEl.value = h;
  };
  handleEl.addEventListener('input', saveHandle);
  handleEl.addEventListener('change', saveHandle);
  handleEl.addEventListener('blur', saveHandle);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function fmtTime(t) {
    try {
      const d = t ? new Date(t) : new Date();
      return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
    } catch { return '00:00:00'; }
  }

  function renderBoard(items) {
    if (!Array.isArray(items)) return;
    feedEl.innerHTML = '';
    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'shout sys';
      empty.textContent = '[SYSTEM] board empty — be first to shout';
      feedEl.appendChild(empty);
      return;
    }
    // sort by time asc
    items.sort((a,b) => new Date(a.time||0) - new Date(b.time||0));
    const frag = document.createDocumentFragment();
    for (const it of items.slice(-500)) { // cap render
      const line = document.createElement('div');
      line.className = 'shout';
      const time = fmtTime(it.time);
      const handle = escapeHtml(it.handle || 'anon');
      const msg = escapeHtml(it.message || '');
      line.innerHTML = `<span class="time">[${time}]</span> <span class="handle">&lt;${handle}&gt;</span> <span class="msg">${msg}</span>`;
      frag.appendChild(line);
    }
    feedEl.appendChild(frag);
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  async function pollBoard() {
    try {
      const res = await fetch('/board', {
        method: 'GET',
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
      });
      if (!res.ok) throw new Error('board '+res.status);
      const data = await res.json();
      renderBoard(data);
    } catch (e) {
      // keep last feed, show sys once
      if (!feedEl.querySelector('.shout')) {
        feedEl.innerHTML = '<div class="shout sys">[ERROR] cannot reach /board</div>';
      }
    }
  }

  async function pollCanary() {
    try {
      const res = await fetch('/canary', { cache: 'no-store', headers: {'Cache-Control':'no-cache'} });
      if (!res.ok) throw new Error();
      const d = await res.json();
      const shouts = d.shouts ?? d.total ?? 0;
      const handles = d.handles ?? d.users ?? 0;
      const size = d.size ?? 0;
      canaryEl.textContent = `clerk: /data/library.db | status: alive | shouts: ${shouts} | handles: ${handles} | size: ${size}kb | volume: mounted`;
    } catch {
      canaryEl.textContent = `clerk: /data/library.db | status: unreachable | shouts: ? | handles: ? | size: ?kb | volume: unmounted`;
    }
  }

  async function shout() {
    const message = msgEl.value.trim();
    if (!message) return;
    const handle = (handleEl.value || '').trim() || 'anon';
    saveHandle();
    sendBtn.disabled = true;
    try {
      await fetch('/shout', {
        method: 'POST',
        cache: 'no-store',
        headers: {
          'Content-Type': 'application/json',
          'Cache-Control': 'no-cache'
        },
        body: JSON.stringify({ message: message.slice(0,512), handle })
      });
      msgEl.value = '';
      msgEl.focus();
      pollBoard(); // immediate refresh
    } catch (e) {
      console.error(e);
    } finally {
      setTimeout(()=> sendBtn.disabled = false, 150);
    }
  }

  sendBtn.addEventListener('click', shout);
  msgEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      shout();
    }
  });

  // init
  msgEl.focus();
  pollBoard();
  pollCanary();
  setInterval(pollBoard, 3000);
  setInterval(pollCanary, 5000);

  // prevent zoom on iOS double-tap input
  document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
})();
</script>
</body>
</html>
