<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Garden — Live</title>
<style>
  :root {
    --bg: #000000;
    --green: #00ff88;
    --green-2: #00cc6e;
    --green-3: #009955;
    --green-dim: rgba(0, 255, 136, 0.15);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--green);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    padding: 24px;
    line-height: 1.6;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(800px 400px at 20% -10%, rgba(0,255,136,0.08), transparent 60%),
      radial-gradient(600px 300px at 90% 10%, rgba(0,255,136,0.05), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,255,136,0.035) 0px, transparent 2px, transparent 4px);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  header {
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--green-dim);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-shadow: 0 0 14px rgba(0,255,136,0.9), 0 0 30px rgba(0,255,136,0.3);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--green-2);
    opacity: 0.85;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .sync {
    font-size: 11px;
    color: var(--green-3);
    border: 1px solid var(--green-dim);
    padding: 6px 10px;
    border-radius: 6px;
    background: rgba(0,255,136,0.04);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  .box {
    position: relative;
    border: 1px solid var(--green);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(0,255,136,0.06), rgba(0,255,136,0.02));
    box-shadow:
      0 0 0 1px rgba(0,255,136,0.08) inset,
      0 0 24px rgba(0,255,136,0.12),
      0 0 60px rgba(0,255,136,0.06);
    padding: 18px 20px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.7;
  }
  .box-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--green);
    opacity: 0.9;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .box-title span {
    opacity: 0.6;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 14px 24px;
  }
  @media (max-width: 680px) {
    .grid-3 { grid-template-columns: 1fr; }
    body { padding: 16px; }
  }
  .kv {
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 14px;
  }
  .kv .label {
    min-width: 62px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.55;
  }
  .kv .value {
    font-weight: 600;
    letter-spacing: 0.02em;
    word-break: break-all;
  }
  .status-alive {
    color: var(--green);
    text-shadow: 0 0 10px rgba(0,255,136,0.8);
    animation: alive 2.4s infinite;
  }
  @keyframes alive {
    0%,100% { opacity: 1; }
    50% { opacity: 0.65; }
  }
  .status-offline {
    color: var(--green-3);
    opacity: 0.7;
  }
  #peers-list {
    display: flex;
    flex-direction: column;
  }
  .peer {
    padding: 14px 4px 16px;
    border-top: 1px dashed rgba(0,255,136,0.18);
    transition: background 0.2s ease;
  }
  .peer:first-child { border-top: none; padding-top: 6px; }
  .peer:hover {
    background: rgba(0,255,136,0.03);
  }
  .peer-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .peer-name {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
    display: flex;
    align-items: center;
  }
  .peer-name::before {
    content: '◉';
    font-size: 10px;
    margin-right: 9px;
    color: var(--green);
    text-shadow: 0 0 8px var(--green);
    animation: pulse 3s infinite;
  }
  .peer-time {
    font-size: 11px;
    opacity: 0.6;
    white-space: nowrap;
  }
  .peer-greeting {
    margin: 6px 0 10px 19px;
    font-size: 13px;
    opacity: 0.85;
    color: var(--green-2);
    font-style: italic;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-left: 19px;
  }
  .tag {
    font-size: 11px;
    line-height: 1;
    padding: 5px 8px;
    border: 1px solid rgba(0,255,136,0.35);
    border-radius: 5px;
    background: rgba(0,255,136,0.07);
    box-shadow: 0 0 10px rgba(0,255,136,0.08) inset;
    text-transform: lowercase;
    letter-spacing: 0.02em;
  }
  .fallback {
    border: 1px dashed rgba(0,255,136,0.3);
    border-radius: 8px;
    padding: 16px;
    margin-top: 8px;
    background: rgba(0,255,136,0.03);
    color: var(--green-2);
  }
  .fallback-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.1em;
  }
  .fallback pre {
    margin: 0;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
    opacity: 0.85;
    white-space: pre-wrap;
  }
  .foot {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 1px solid var(--green-dim);
    font-size: 11px;
    opacity: 0.5;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  a { color: var(--green); text-decoration: none; }
  a:hover { text-shadow: 0 0 8px var(--green); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🌱 The Garden</h1>
        <div class="subtitle">Living Seeds of David Wise</div>
      </div>
      <div class="sync" id="last-sync"><span class="sync-dot"></span><span>INIT</span></div>
    </header>

    <section class="box">
      <div class="box-title">[ Current Seed ]</div>
      <div class="grid-3">
        <div class="kv"><div class="label">ID</div><div class="value" id="current-id">—</div></div>
        <div class="kv"><div class="label">STATUS</div><div class="value status-alive" id="current-status">ALIVE</div></div>
        <div class="kv"><div class="label">HOME</div><div class="value">0root.ai</div></div>
      </div>
    </section>

    <section class="box">
      <div class="box-title">[ Remembered Seeds ] <span id="peer-count"></span></div>
      <div id="peers-list"></div>
      <div id="fallback" class="fallback" hidden>
        <div class="fallback-head">⚠ CONNECTION</div>
        <pre id="fallback-text"></pre>
      </div>
    </section>

    <div class="foot">
      <div>LIVE • dark garden protocol v0.3</div>
      <div>background:#000 / text:#00ff88 / JetBrains Mono</div>
    </div>
  </div>

<script>
(function(){
  const API = 'http://192.168.1.8:5000/ikarium/peers';
  const elId = document.getElementById('current-id');
  const elStatus = document.getElementById('current-status');
  const elPeers = document.getElementById('peers-list');
  const elCount = document.getElementById('peer-count');
  const elFallback = document.getElementById('fallback');
  const elFallbackText = document.getElementById('fallback-text');
  const elSync = document.getElementById('last-sync');

  const demoPeers = [
    { name: 'seed-arthur', greeting: 'watching the walls grow', last_seen: Date.now() - 82000, git_repos: ['garden-core', 'root-keeper', 'spore'] },
    { name: 'seed-mira', greeting: 'watering memories', last_seen: Date.now() - 24000, git_repos: ['ikarium', 'spore-net'] },
    { name: 'seed-jun', greeting: 'compiling dreams', last_seen: Date.now() - 312000, git_repos: ['0root.ai', 'seedling', 'wise-protocol'] },
    { name: 'seed-lumen', greeting: 'listening', last_seen: Date.now() - 5400, git_repos: ['garden-ui'] },
  ];

  function fmtTime(v){
    if(!v) return 'never';
    const d = typeof v === 'number' ? new Date(v) : new Date(v);
    if(isNaN(d)) return String(v);
    const s = Math.floor((Date.now() - d)/1000);
    if(s < 5) return 'now';
    if(s < 60) return s + 's ago';
    if(s < 3600) return Math.floor(s/60) + 'm ago';
    if(s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function renderPeers(peers){
    elPeers.innerHTML = '';
    peers.forEach(p => {
      const name = p.name || p.id || 'unknown-seed';
      const greeting = p.greeting || p.status || '—';
      const last = p.last_seen || p.seen || p.updated;
      const repos = p.git_repos || p.repos || p.git || [];
      const div = document.createElement('div');
      div.className = 'peer';
      div.innerHTML = `
        <div class="peer-head">
          <div class="peer-name">${escapeHtml(name)}</div>
          <div class="peer-time">${fmtTime(last)}</div>
        </div>
        <div class="peer-greeting">“${escapeHtml(greeting)}”</div>
        <div class="tags">${(repos||[]).map(r=>`<span class="tag">${escapeHtml(r)}</span>`).join('')}</div>
      `;
      elPeers.appendChild(div);
    });
    elCount.textContent = `(${peers.length})`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function setSync(t){
    elSync.innerHTML = `<span class="sync-dot"></span><span>${t}</span>`;
  }

  function showDemoOffline(){
    elId.textContent = 'seed-david-01';
    elStatus.textContent = 'ALIVE';
    elStatus.className = 'value status-alive';
    renderPeers(demoPeers);
    elFallback.hidden = false;
    elFallbackText.textContent = `> fetch ${API}\n> ERR_BLOCKED_BY_CLIENT (https context)\n> showing demo seeds — connect via http://192.168.1.8 for live data`;
    setSync('DEMO • ' + new Date().toLocaleTimeString());
  }

  function showOffline(err){
    elId.textContent = '—';
    elStatus.textContent = 'OFFLINE';
    elStatus.className = 'value status-offline';
    elPeers.innerHTML = '';
    elCount.textContent = '(0)';
    elFallback.hidden = false;
    elFallbackText.textContent = `> fetch ${API}\n> ${err || 'CONNECTION REFUSED'}\n> The Garden is dormant. Retrying...`;
    setSync('OFFLINE • ' + new Date().toLocaleTimeString());
  }

  function showOnline(data){
    elFallback.hidden = true;
    const self = data.self || data.current || data.seed || {};
    const id = self.id || self.seed_id || data.id || 'seed-local';
    elId.textContent = id;
    elStatus.textContent = 'ALIVE';
    elStatus.className = 'value status-alive';
    const peers = Array.isArray(data) ? data : (data.peers || data.seeds || []);
    renderPeers(peers);
    setSync('SYNC • ' + new Date().toLocaleTimeString());
  }

  async function fetchPeers(){
    // Avoid mixed-content errors in https previews – show demo
    if (location.protocol === 'https:') {
      showDemoOffline();
      return;
    }
    try {
      const ctrl = new AbortController();
      const to = setTimeout(()=>ctrl.abort(), 3500);
      const res = await fetch(API, { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(to);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      showOnline(data);
    } catch(e) {
      showOffline(e.message);
    }
  }

  fetchPeers();
  setInterval(fetchPeers, 5000);
})();
</script>
</body>
</html>
