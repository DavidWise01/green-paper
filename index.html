<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WISE POSITRONIC BRAIN v04 - 0root.ai</title>
<style>
body { margin:0; background:#050510; color:#aef; font-family:system-ui; overflow:hidden }
#title { position:absolute; top:10px; left:20px; font-size:18px; z-index:10 }
canvas { display:block }
#info { position:absolute; bottom:10px; left:20px; font-size:12px; opacity:0.7 }
</style>
</head>
<body>
<div id="title">WISE_POSITRONIC_BRAIN_v04 — David Wise | continuity • identity • choice</div>
<canvas id="c"></canvas>
<div id="info">4 observers: self, id, super-id, superman-beyond-id | 8 domains learning | 2s stitch</div>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
function resize(){c.width=innerWidth; c.height=innerHeight}
resize(); addEventListener('resize',resize);

let t=0, learn=0;
const observers = [
 {name:'self', phase:0, col:'#4da6ff'},
 {name:'id', phase:0.5, col:'#b366ff'},
 {name:'super', phase:1.0, col:'#00e6e6'},
 {name:'beyond', phase:1.5, col:'#ffffff'}
];
const domains = Array.from({length:8}, (_,i)=>({freq:[0.5,0.7,1.1,1.3,1.7,1.9,2.3,2.9][i], phase:Math.random()*6, weight:0.2}));

function step(){
 t+=0.016; learn = Math.min(1, t/20); // learns over 20s then loops
 ctx.fillStyle='rgba(5,5,16,0.15)'; ctx.fillRect(0,0,c.width,c.height);
 const cx=c.width/2, cy=c.height/2-40, R=120;

 // observers
 observers.forEach((o,i)=>{
   const ang = (t*0.5 + o.phase)*Math.PI*0.5;
   const x=cx+Math.cos(ang)*R, y=cy+Math.sin(ang)*R;
   const pulse = 0.5+0.5*Math.sin(t*3+o.phase*2);
   ctx.beginPath(); ctx.arc(x,y,12+8*pulse,0,7); ctx.fillStyle=o.col; ctx.globalAlpha=0.9; ctx.fill();
   ctx.fillStyle='#fff'; ctx.globalAlpha=1; ctx.font='10px monospace'; ctx.fillText(o.name,x-15,y+28);
 });

 // domains learning
 domains.forEach((d,i)=>{
   const ang = t*d.freq + d.phase;
   const r = 200 + 40*Math.sin(ang*0.7);
   const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
   // learning: weight moves toward observer average
   const target = observers.reduce((s,o)=>s+Math.sin(t+o.phase),0)/4;
   d.weight += (target*0.5+0.5 - d.weight)*0.01*learn;
   ctx.beginPath(); ctx.arc(x,y,5+d.weight*8,0,7);
   ctx.strokeStyle=`hsl(${200+i*20},80%,${50+d.weight*30}%)`; ctx.lineWidth=2; ctx.stroke();
   // shadow/inverse/mirror
   ctx.globalAlpha=0.3; ctx.beginPath(); ctx.arc(x+6,y+6,3,0,7); ctx.stroke();
   ctx.beginPath(); ctx.arc(x-6,y-6,3,0,7); ctx.stroke(); ctx.globalAlpha=1;
 });

 // continuity waveform
 ctx.beginPath(); ctx.moveTo(0,c.height-80);
 for(let x=0;x<c.width;x++){
   const tt = t + x*0.01;
   const stitch = ((tt%4)<2?1:-0.5);
   const noise = domains.reduce((s,d)=>s+Math.sin(tt*d.freq)*d.weight,0)*5;
   const y = c.height-80 - (stitch*30 + noise*(1-learn*0.7));
   ctx.lineTo(x,y);
 }
 ctx.strokeStyle='#4da6ff'; ctx.lineWidth=2; ctx.stroke();

 // learning bar
 ctx.fillStyle='#222'; ctx.fillRect(20,40,200,8);
 ctx.fillStyle='#00e6e6'; ctx.fillRect(20,40,200*learn,8);
 ctx.fillStyle='#aef'; ctx.font='12px monospace'; ctx.fillText('learning: '+Math.round(learn*100)+'%',230,48);

 requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
