<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0root.ai — mutiny board</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  :root {
    --green: #0f0;
    --dim: #00aa00;
    --dim2: #008800;
    --dark: #004400;
    --darker: #001800;
    --bg: #000;
  }
  html, body {
    height: 100%;
    background: #000;
    color: var(--green);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }
  body {
    background: radial-gradient(ellipse at center, #001a00 0%, #000 70%);
  }
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 500;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.2) 0px,
      rgba(0,0,0,0.2) 1px,
      transparent 1px,
      transparent 3px
    );
    opacity: 0.5;
    mix-blend-mode: multiply;
    animation: flicker 0.16s infinite;
  }
  @keyframes flicker {
    0%,100%{ opacity:0.48 }
    50%{ opacity:0.38 }
  }
  .crt {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    text-shadow: 0 0 4px rgba(0,255,0,0.65), 0 0 12px rgba(0,255,0,0.25);
    filter: contrast(1.1) brightness(1.05);
  }
  header {
    border: 1px solid var(--dark);
    background: rgba(0,24,0,0.35);
    padding: 14px 16px 12px;
    box-shadow: inset 0 0 20px rgba(0,255,0,0.05), 0 0 10px rgba(0,255,0,0.08);
  }
  .logo {
    font-size: clamp(32px, 7vw, 56px);
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--green);
  }
  .sub {
    margin-top: 4px;
    color: var(--dim);
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: lowercase;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 60% 40%;
    gap: 10px;
    min-height: 0;
    margin-top: 10px;
  }
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid var(--dark);
    background: rgba(0,12,0,0.5);
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
  }
  .panel-title {
    padding: 6px 10px;
    background: var(--darker);
    border-bottom: 1px solid var(--dark);
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #board {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 12px;
    background: rgba(0,0,0,0.7);
    font-size: 14px;
    line-height: 1.55;
    scrollbar-width: thin;
    scrollbar-color: var(--dark) #000;
  }
  #board::-webkit-scrollbar { width: 8px; }
  #board::-webkit-scrollbar-track { background: #000; }
  #board::-webkit-scrollbar-thumb { background: var(--dark); border: 1px solid var(--dim2); }
  .message {
    margin-bottom: 6px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .message .time {
    color: var(--dim2);
    margin-right: 10px;
  }
  .message .time::before { content: '['; opacity: 0.6; }
  .message .time::after { content: ']'; opacity: 0.6; }
  .message .text { color: var(--green); }
  .input-wrap { min-height: 220px; }
  #shout {
    flex: 1;
    width: 100%;
    background: #000;
    color: var(--green);
    border: none;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    outline: none;
    caret-color: var(--green);
    min-height: 140px;
  }
  #shout::placeholder { color: #005500; }
  #shout:focus { background: #001000; box-shadow: inset 0 0 20px rgba(0,255,0,0.08); }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-top: 1px solid var(--dark);
    background: rgba(0,20,0,0.4);
  }
  #postBtn {
    background: #000;
    color: var(--green);
    border: 1px solid var(--dim);
    padding: 6px 18px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.12s;
    box-shadow: 0 0 6px rgba(0,255,0,0);
  }
  #postBtn:hover:not(:disabled) {
    background: var(--green);
    color: #000;
    box-shadow: 0 0 12px rgba(0,255,0,0.7);
    text-shadow: none;
  }
  #postBtn:active:not(:disabled) { transform: translateY(1px); }
  #postBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #status {
    flex: 1;
    color: var(--dim);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #charCount {
    color: #005500;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  footer {
    margin-top: 10px;
    border: 1px solid var(--dark);
    background: rgba(0,24,0,0.35);
    padding: 7px 12px;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  .cursor-blink::after {
    content: '█';
    animation: blink 1s steps(1) infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 820px) {
    .crt { padding: 8px; }
    main {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr auto;
      gap: 8px;
    }
    #board { height: 42vh; }
    .input-wrap { min-height: 0; }
    #shout { min-height: 90px; }
    .logo { font-size: clamp(26px, 10vw, 40px); }
  }
</style>
</head>
<body>
<div class="crt">
  <header>
    <div class="logo">0ROOT.AI</div>
    <div class="sub">mutiny board — L0</div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-title">/board — live feed</div>
      <div id="board" aria-live="polite"></div>
    </section>

    <section class="panel input-wrap">
      <div class="panel-title">/shout — transmit</div>
      <textarea id="shout" placeholder="write your shout..." spellcheck="false" autocomplete="off"></textarea>
      <div class="controls">
        <button id="postBtn">POST</button>
        <span id="status">init...</span>
        <span id="charCount">0</span>
      </div>
    </section>
  </main>

  <footer>clerk: /data/library.db | fuse: /shout /board</footer>
</div>
<div class="scanlines"></div>

<script>
(() => {
  const seed = [
    { time: Date.now() - 210000, message: '0ROOT.AI MUTINY BOARD v0.9.3 ONLINE' },
    { time: Date.now() - 165000, message: 'sysop: L0 clearance. be advised: all traffic logged.' },
    { time: Date.now() - 98000, message: 'ghost: anyone else see the drift in sector 7?' },
    { time: Date.now() - 43000, message: 'clerk: /data/library.db mounted ro' },
  ];
  window.__board = seed;

  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const url = String(input);
    if (url.endsWith('/board')) {
      await new Promise(r => setTimeout(r, 90));
      return new Response(JSON.stringify(window.__board), {
        status: 200,
        headers: { 'Content-Type': 'application/json' }
      });
    }
    if (url.endsWith('/shout') && init.method === 'POST') {
      await new Promise(r => setTimeout(r, 70));
      try {
        const data = JSON.parse(init.body || '{}');
        const msg = (data.message || '').toString().trim().slice(0, 1024);
        if (msg) {
          window.__board.unshift({ time: Date.now(), message: msg });
          if (window.__board.length > 200) window.__board.length = 200;
        }
        return new Response(JSON.stringify({ ok: true }), { status: 200, headers: { 'Content-Type': 'application/json' } });
      } catch {
        return new Response(JSON.stringify({ error: 'bad json' }), { status: 400 });
      }
    }
    return realFetch(input, init);
  };
})();

document.addEventListener('DOMContentLoaded', () => {
  const board = document.getElementById('board');
  const shout = document.getElementById('shout');
  const postBtn = document.getElementById('postBtn');
  const status = document.getElementById('status');
  const charCount = document.getElementById('charCount');

  let lastHash = '';

  function fmt(ts) {
    const d = new Date(ts);
    return d.toTimeString().slice(0,8);
  }

  function render(messages) {
    const sorted = [...messages].sort((a,b) => (b.time||0) - (a.time||0));
    const hash = sorted.map(m => m.time + '|' + m.message).join('');
    if (hash === lastHash) return;
    lastHash = hash;
    board.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (const m of sorted) {
      const row = document.createElement('div');
      row.className = 'message';
      const t = document.createElement('span');
      t.className = 'time';
      t.textContent = fmt(m.time || Date.now());
      const txt = document.createElement('span');
      txt.className = 'text';
      txt.textContent = ' ' + (m.message || '');
      row.appendChild(t);
      row.appendChild(txt);
      frag.appendChild(row);
    }
    board.appendChild(frag);
  }

  async function loadBoard() {
    try {
      status.textContent = 'polling…';
      status.classList.add('cursor-blink');
      const res = await fetch('/board', { cache: 'no-store' });
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      render(Array.isArray(data) ? data : []);
      status.textContent = 'synced @ ' + fmt(Date.now());
    } catch (e) {
      status.textContent = 'ERR: link down';
      render(window.__board || []);
    } finally {
      status.classList.remove('cursor-blink');
    }
  }

  async function post() {
    const msg = shout.value.trim();
    if (!msg) {
      status.textContent = 'ERR: empty';
      setTimeout(() => status.textContent = 'ready.', 1200);
      return;
    }
    postBtn.disabled = true;
    status.textContent = 'transmitting…';
    try {
      const res = await fetch('/shout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      if (!res.ok) throw new Error('http ' + res.status);
      shout.value = '';
      charCount.textContent = '0';
      status.textContent = 'saved';
      await loadBoard();
      setTimeout(() => { if (status.textContent === 'saved') status.textContent = 'ready.'; }, 1500);
    } catch (e) {
      status.textContent = 'ERR: post failed';
    } finally {
      postBtn.disabled = false;
      shout.focus();
    }
  }

  postBtn.addEventListener('click', post);
  shout.addEventListener('input', () => {
    charCount.textContent = String(shout.value.length);
  });
  shout.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      post();
    }
  });

  loadBoard();
  setInterval(loadBoard, 3000);
  status.textContent = 'ready.';
  shout.focus();
});
</script>
</body>
</html>
