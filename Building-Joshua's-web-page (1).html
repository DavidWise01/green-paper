      <h1>Idaho Falls & Bonneville County</h1>
      <div class="prose">
        <p>Idaho Falls sits at about 4,700 feet elevation on the Snake River Plain, which gives us a high-desert climate with real winters. We are USDA Zone 5b (average minimum -15°F to -10°F), with a short growing season of roughly 120 to 140 frost-free days, typically late May to mid-September. That matters more than any plant tag.</p>
        <p>Annual precipitation averages only 11 to 13 inches, and most of that comes as winter snow. Summers are dry, sunny, and windy, with frequent afternoon gusts down the plain. Water evaporates fast, and without mulch or shade, new plantings stress within hours. Winter brings freeze-thaw cycles that heave poorly planted perennials and crack irrigation lines if they aren't blown out by early October.</p>
        <p>Soils vary block by block. Near the river and in older parts of Idaho Falls, you'll find well-drained sandy loam with good volcanic content. Head to the benches in Ammon, Iona, or Lincoln, and you hit heavier clay loam and caliche layers that drain slowly and compact easily under equipment. New subdivisions often have 2–4 inches of stripped topsoil over compacted subgrade — a recipe for drowned roots and patchy lawns unless amended.</p>
        <p>Bonneville County communities — Ammon, Ucon, Iona, Swan Valley, and the county outskirts — share these constraints but add their own microclimates. Ammon sits slightly higher and colder, with more wind exposure. Areas near the foothills see earlier frosts. Well water is common outside city limits, often high in minerals, which affects irrigation emitter clogging and soil pH over time.</p>

    content: `
      <h1>Seven Principles of Xeriscaping</h1>
      <div class="prose">
        <p>Xeriscaping was developed in Colorado for dry, cold climates very similar to Idaho Falls. It's not a style — it's a method. Here are the seven principles, translated for Bonneville County yards.</p>
        <h3>1. Planning and Design</h3>
        <p>Start with a simple sketch. Map sun, wind, and slope. Group plants by water need (hydrozones) — put thirstier plants near downspouts or in low spots, and drought-tough natives on hot slopes and park strips. Keep turf only where you use it. In Idaho Falls, a 10×10 play lawn often makes more sense than a full front yard.</p>
        <h3>2. Soil Improvement</h3>
        <p>Our native soils are low in organic matter. Before planting, loosen compacted areas and mix in 2–3 inches of quality compost to a depth of 6–8 inches. This improves water infiltration in clay and water holding in sand. Don't rototill wet clay — you'll create bricks. Test pH; many local soils run 7.5–8.0, which limits iron uptake for some plants.</p>
        <h3>3. Practical Turf Areas</h3>
        <p>Bluegrass needs about 25–35 inches of water per year here to stay green — more than double our rainfall. Reduce lawn size, choose turf-type tall fescue for deeper roots, and mow high (3–3.5 inches) to shade soil. Avoid narrow strips that sprinklers overshoot onto sidewalk.</p>
        <h3>4. Appropriate Plant Selection</h3>
        <p>Choose plants hardy to Zone 4 or 5 to survive our winters. Natives and adapted species like Rocky Mountain juniper, serviceberry, rabbitbrush, penstemon, and blue grama grass thrive with minimal water once established (usually 1–2 seasons). Place plants where their mature size fits — no constant shearing.</p>
        <h3>5. Mulch</h3>
        <p>Apply 3 inches of wood bark mulch in beds and 2–3 inches of crushed gravel in hot, windy zones. Mulch cuts evaporation by 30–50%, moderates soil temperature swings, and prevents weed seed germination. Keep mulch a few inches away from tree trunks and house siding.</p>
        <h3>6. Efficient Irrigation</h3>
        <p>Ditch old spray heads that mist in our wind. Use drip lines for beds and MP rotators or rotary nozzles for lawns. Water deeply but infrequently — 1 inch per week for lawns in peak summer, applied in 2–3 cycles to avoid runoff on clay. Install a smart controller with rain/freeze sensor and blow out lines by early October.</p>
        <h3>7. Maintenance</h3>
        <p>Water-wise yards aren't no-maintenance. Pull weeds early, cut back perennials in late winter, refresh mulch every 2–3 years, and adjust irrigation each season. Aerate lawns every fall to combat compaction. The payoff: once established, a xeric landscape in Idaho Falls often uses 40–60% less water than a traditional lawn-dominated yard, and survives drought restrictions and winter kill far better.</p>

      <h1>Native Plants for Eastern Idaho</h1>

        <p>Native and well-adapted plants have already solved the problems our climate throws at them — cold, wind, alkaline soil, and low water. Using them reduces work and increases survival. Here are reliable choices for Idaho Falls (Zone 5b).</p>
        <h3>Trees & Shrubs</h3>
        <p><strong>Rocky Mountain Juniper (Juniperus scopulorum)</strong> – Evergreen, wind-tolerant, excellent screening. Grows slowly to 20–30'. No extra water once established. <strong>Serviceberry (Amelanchier alnifolia)</strong> – Native to our foothills, white spring flowers, edible berries for birds, great fall color, handles clay. <strong>Chokecherry (Prunus virginiana)</strong> – Tough, suckers to form thickets, good for wildlife. <strong>Rabbitbrush (Ericameria nauseosa)</strong> – Late-summer yellow blooms, silver foliage, thrives in poor, dry soil; cut back to 6" each spring.</p>
        <h3>Perennials & Grasses</h3>
        <p><strong>Blue Flax (Linum lewisii)</strong> – Sky-blue flowers, reseeds gently, loves sun. <strong>Penstemon (Penstemon strictus, P. pinifolius)</strong> – Hummingbird magnets, need sharp drainage. <strong>Blanketflower (Gaillardia aristata)</strong> – Long bloom, handles heat. <strong>Prairie Sage (Artemisia ludoviciana)</strong> – Silver aromatic foliage, spreads — use where you want groundcover. <strong>Yarrow (Achillea millefolium)</strong> – Native form is white, very drought tolerant. <strong>Grasses:</strong> Bluebunch wheatgrass, Idaho fescue, and prairie junegrass provide texture and winter interest with almost no water.</p>
        <h3>Design Tips</h3>
        <p>Plant in drifts of 3–7 for visual impact. Combine fine textures (grasses) with bold leaves (sage). Give everything space for mature width — crowding leads to disease in our still nights. Water deeply every 7–10 days the first summer, then taper. By year three, most of these survive on rainfall plus occasional deep soak during extreme drought. Avoid amending individual planting holes heavily; it creates a 'teacup' that holds water and rots roots in clay. Amend the whole bed instead, and plant high (root crown 1" above grade) to improve drainage.</p>
        <p>Using natives doesn't mean a messy yard. With thoughtful spacing, mulch, and edging, a native planting looks intentional and fits HOA guidelines while supporting pollinators that struggle in traditional lawns.</p>
      </div>

      <h1>Spring Startup Checklist</h1>
      <div class="prose">
        <p>Idaho Falls springs are unpredictable — 70°F one day, snow the next. Wait until soil is workable (not soggy) and daytime temps are consistently above 45°F, usually mid-April to early May.</p>
        <h3>1. Clean up, but not too early</h3>
        <p>Leave perennial stems and leaf litter until nighttime lows are reliably above 35°F to protect overwintering beneficial insects. Then rake gently, removing matted leaves that smother crowns.</p>
        <h3>2. Irrigation system check</h3>
        <p>Slowly pressurize the main line and walk each zone. Look for cracked heads from winter freeze, sunken heads, and overspray onto hardscapes. Replace nozzles with water-efficient MP rotators. Check drip lines for rodent chew. Set controller to 50–60% of summer run time for April–May; our soils are still moist from snowmelt.</p>
        <h3>3. Lawn care</h3>
        <p>Rake lightly to lift matted grass. Aerate when soil is moist but not wet — core aeration relieves compaction from snow load. Do not dethatch aggressively unless thatch exceeds ½". Apply a light, slow-release nitrogen fertilizer around mid-May after first mowing, not earlier. Mow at 3–3.5 inches, and leave clippings.</p>
        <h3>4. Beds and soil</h3>
        <p>Top-dress beds with 1 inch of compost, working gently around established plants. Refresh mulch to maintain 3 inches total, keeping it off crowns and trunks. Edge beds with a sharp spade to keep grass out.</p>
        <h3>5. Pruning</h3>
        <p>Prune summer-blooming shrubs (rabbitbrush, spirea) before bud break. Wait to prune spring bloomers (lilac, forsythia) until right after flowering. Cut back ornamental grasses to 4–6 inches. Remove winter dieback on roses and shape, but wait until forsythia blooms to be sure cold has passed.</p>
        <h3>6. Planting</h3>
        <p>Early spring is ideal for trees, shrubs, and cool-season perennials. Plant as soon as ground is workable. Water new plantings deeply at planting, then every 5–7 days if rain is lacking. Hold off on warm-season annuals and vegetables until after last frost (typically Memorial Day).</p>
        <h3>7. Weed prevention</h3>
        <p>Apply corn gluten meal or pre-emergent for crabgrass when soil temps reach 55°F (about when lilacs show first leaf). Pull winter annual weeds before they seed.</p>
        <p>Doing these tasks in order — irrigation first, then cleanup, then soil, then planting — prevents rework and saves water all season. A slow spring start leads to stronger roots that handle July wind and August heat without constant watering.</p>

function buildNav(items, currentPath){
  let html = '<ul>';
  for(const item of items){
    const isCurrent = currentPath === item.path;
    const isAncestor = item.path !== '/' && currentPath.startsWith(item.path + '/');
    const cls = isCurrent ? 'active' : isAncestor ? 'ancestor' : '';
    html += `<li><button data-path="${item.path}" class="${cls}">${item.label}</button>`;
    if(item.children){ html += buildNav(item.children, currentPath); }
    html += `</li>`;
  }
  html += '</ul>';
  return html;
}

function renderBreadcrumb(path){
  const bc = document.getElementById('breadcrumb');
  const parts = path.split('/').filter(Boolean);
  const crumbs = [{label:'Home', path:'/'}];
  let accum = '';
  parts.forEach(p => {
    accum += '/' + p;
    const page = pages[accum];
    if(page) crumbs.push({label: page.navLabel || page.title, path: accum});
  });
  bc.innerHTML = crumbs.map((c,i) => {
    const isLast = i === crumbs.length -1;
    return `<li>${i>0?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>':''}<button data-path="${c.path}" class="${isLast?'current':''}">${c.label}</button></li>`;
  }).join('');
}

function renderPage(path){
  const page = pages[path] || pages['/'];
  document.getElementById('page-content').innerHTML = page.content;
  document.title = page.title + ' – Wise Landscaping';
  renderBreadcrumb(path);
  document.getElementById('sidenav').innerHTML = buildNav(siteMap, path);
  document.querySelectorAll('.topnav button').forEach(btn => {
    const bp = btn.dataset.path;
    btn.classList.toggle('active', path === bp || path.startsWith(bp + '/'));
  });
  window.scrollTo(0,0);
}

function navigate(path){
  if(!pages[path]) path = '/';
  if(location.hash.slice(1) !== path){
    location.hash = path;
  }else{
    renderPage(path);
  }
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-path]');
  if(btn){ e.preventDefault(); navigate(btn.dataset.path); }
});

window.addEventListener('hashchange', () => renderPage(location.hash.slice(1) || '/'));
renderPage(location.hash.slice(1) || '/');
</script>
